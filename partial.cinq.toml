# Outputs that need three channels of JACK

[[output]]
name = "House"
device = "jack:output"
device_name = "JACK Output"
channels = "1-2"

[[output]]
name = "Sub"
device = "jack:output"
device_name = "JACK Output"
channels = "3"

[[list]]
name = "Main"

[[list.cue]]
id = 1
number = "1"
kind = "audio"
name = "Music"
file = "music.flac"

[list.cue.sends]
House = 0.0
Sub = 0.0
