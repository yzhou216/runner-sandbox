# Light cues on universes 1, 2, and 999 at 20, 30, 40, 50, 70, 80, and 100
# percent, with a fade of four seconds, then network cues for fakeeos.py:
# a burst of four within half a second, a destination that refuses, and
# single cues, GO by GO
[[instrument]]
id = 1
name = "Front"
address = 1

[[instrument]]
id = 2
name = "Back"
address = 2

[[instrument]]
id = 3
name = "Side"
universe = 2
address = 1

[[instrument]]
id = 4
name = "Far"
universe = 999
address = 1

[[instrument]]
id = 5
name = "Edge"
universe = 999
address = 512

[[list]]
name = "Main"

[[list.cue]]
id = 1
number = "1"
kind = "light"
name = "Preset"
duration = 0.0

[list.cue.lights]
1 = 20.0
3 = 50.0
4 = 100.0

[[list.cue]]
id = 2
number = "2"
kind = "light"
name = "Fade"
duration = 4.0

[list.cue.lights]
1 = 70.0
2 = 80.0
3 = 100.0
4 = 30.0

[[list.cue]]
id = 3
number = "3"
kind = "light"
name = "Hold"
duration = 0.0

[list.cue.lights]
1 = 50.0
4 = 40.0
5 = 100.0

[[list.cue]]
id = 4
number = "4"
kind = "network"
name = "Burst 1, TCP"
destination = "127.0.0.1:3037"
message = '/burst/1 7 2.5 "hello world" "12"'
post_wait = 0.1
advance = "continue"

[[list.cue]]
id = 5
number = "5"
kind = "network"
name = "Burst 2, TCP"
destination = "127.0.0.1:3037"
message = "/burst/2 -3"
post_wait = 0.1
advance = "continue"

[[list.cue]]
id = 6
number = "6"
kind = "network"
name = "Burst 3, UDP"
destination = "udp://127.0.0.1:8000"
message = '/burst/3 "x" 1.5'
post_wait = 0.1
advance = "continue"

[[list.cue]]
id = 7
number = "7"
kind = "network"
name = "Burst 4, TCP"
destination = "127.0.0.1:3037"
message = "/burst/4"

[[list.cue]]
id = 8
number = "8"
kind = "network"
name = "Nobody there"
destination = "127.0.0.1:3999"
message = "/refused 1"

[[list.cue]]
id = 9
number = "9"
kind = "network"
name = "After 1"
destination = "127.0.0.1:3037"
message = "/after/1 1"

[[list.cue]]
id = 10
number = "10"
kind = "network"
name = "After 2, console down"
destination = "127.0.0.1:3037"
message = "/after/2 2"

[[list.cue]]
id = 11
number = "11"
kind = "network"
name = "After 3, console back"
destination = "127.0.0.1:3037"
message = "/after/3 3"

[[list.cue]]
id = 12
number = "12"
kind = "network"
name = "After 4"
destination = "127.0.0.1:3037"
message = "/after/4 4"
