# Network cues to fakeeos.py on the same computer: TCP and UDP with int,
# float, and quoted-string arguments, a destination that refuses, a burst of
# three cues within a second, three cues a few seconds apart, and cues
# around a stand-in that restarts
[[list]]
name = "Main"

[[list.cue]]
id = 1
number = "1"
kind = "network"
name = "TCP"
destination = "127.0.0.1:3037"
message = '/test/tcp 7 1.5 "hello world" "42"'

[[list.cue]]
id = 2
number = "2"
kind = "network"
name = "UDP"
destination = "udp://127.0.0.1:8000"
message = '/test/udp 7 1.5 "hello world" "42"'

[[list.cue]]
id = 3
number = "3"
kind = "network"
name = "Refused"
destination = "127.0.0.1:3999"
message = "/test/refused"

[[list.cue]]
id = 4
number = "4"
kind = "network"
name = "Burst 1"
destination = "127.0.0.1:3037"
message = "/test/burst 1"

[[list.cue]]
id = 5
number = "5"
kind = "network"
name = "Burst 2"
destination = "127.0.0.1:3037"
message = "/test/burst 2"

[[list.cue]]
id = 6
number = "6"
kind = "network"
name = "Burst 3"
destination = "127.0.0.1:3037"
message = "/test/burst 3"

[[list.cue]]
id = 7
number = "7"
kind = "network"
name = "Apart 1"
destination = "127.0.0.1:3037"
message = "/test/apart 1"

[[list.cue]]
id = 8
number = "8"
kind = "network"
name = "Apart 2"
destination = "127.0.0.1:3037"
message = "/test/apart 2"

[[list.cue]]
id = 9
number = "9"
kind = "network"
name = "Apart 3"
destination = "127.0.0.1:3037"
message = "/test/apart 3"

[[list.cue]]
id = 10
number = "10"
kind = "network"
name = "Console down"
destination = "127.0.0.1:3037"
message = "/test/down"

[[list.cue]]
id = 11
number = "11"
kind = "network"
name = "Console back"
destination = "127.0.0.1:3037"
message = "/test/back"
