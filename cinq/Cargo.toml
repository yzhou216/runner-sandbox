[package]
name = "cinq"
version = "0.1.4"
edition = "2024"
rust-version = "1.91" # Path::with_added_extension in the build script
description = "Minimal cue-based show controller in the spirit of QLab"
license = "GPL-3.0-or-later"
repository = "https://github.com/yzhou216/cinq"
keywords = ["show-control", "qlab", "cue", "theater", "audio"]
categories = ["multimedia::audio", "multimedia::video"]
include = [
  "/build.rs",
  "/src",
  "/man",
  "/share",
  "/LICENSES",
  "/REUSE.toml",
  "/README.md",
]

[features]
default = ["jack"]
jack = ["cpal/jack"] # JACK's devices, which need JACK to build on GNU/Linux

[dependencies]
anstyle-query = "1.1"
bon = "3.10"
clap = { version = "4.6", features = ["derive"] }
ctrlc = { version = "3.5", features = [ # Problems screen left on Control+c
  "termination",
] }
dirs = "7.0"
iced = { version = "0.14", default-features = false, features = [ # Wayland alone, and cinq's own theme
  "advanced",
  "crisp",
  "image-without-codecs", # Pictures of video cues, which come decoded
  "tiny-skia",
  "tokio",
  "wayland",
  "web-colors",
  "wgpu",
] }
image = { version = "0.25", default-features = false, features = [
  "jpeg",
  "png",
] }
itertools = "0.15"
keyboard-types = "0.8"
kira = { version = "0.12", default-features = false, features = [
  "aac",
  "cpal",
  "flac",
  "isomp4",
  "mp3",
  "ogg",
  "pcm",
  "vorbis",
  "wav",
] }
miette = { version = "7.6", default-features = false, features = [
  "fancy-no-backtrace",
] }
mp4-atom = "0.17" # Tracks of the files of video cues, which the tests write too
notify-debouncer-full = "0.7"
open = "5.4"
pathdiff = "0.2"
rayon = "1.12"
rfd = "0.17"
rtrb = "0.4" # Commands to the threads that mix sound, which kira brings
rust_h264 = "0.6" # Decoder of H.264 that needs no C++ compiler
serde = { version = "1.0", features = ["derive"] }
strum = { version = "0.28", features = ["derive"] }
supports-color = "3.0" # Colors of miette's reports, asked while standard error is still the terminal
supports-hyperlinks = "3.2" # Links of miette's reports, asked the same way
supports-unicode = "3.0" # Characters of miette's reports, asked the same way
taplo = { version = "0.14", default-features = false } # Formatting of config.toml once saved
tempfile = "3.27"
terminal_size = "0.4" # Problems redrawn at a new size, which miette brings
tokio = { version = "1.54", default-features = false, features = [ # Timer of the ticks, which needs iced's tokio executor
  "time",
] }
toml = { version = "1.1", default-features = false, features = [
  "display",
  "parse",
  "serde",
  "std",
] }
unicode-width = "0.2" # Columns of a character on screen, which iced brings
yuv = "0.8" # Colors of the pictures of video cues, in RGBA

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = [ # Standard output and error pointed at a pipe while the problems screen shows
  "event",
  "pipe",
  "stdio",
] }

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd"))'.dependencies]
cpal = { version = "0.18", default-features = false, optional = true } # JACK beside ALSA in kira's cpal

[build-dependencies] # Manual pages, completions, the icon with resvg's kurbo, the app bundle for Darwin, and the manifest for Windows
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
clap_complete_nushell = "4.6"
clap_mangen = "0.3"
embed-manifest = "1.5"
icns = { version = "0.5", default-features = false, features = ["pngio"] }
kurbo = "0.13"
resvg = { version = "0.49", default-features = false }
strum = { version = "0.28", features = ["derive"] }
time = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies] # Tests of what the build renders, and of the config watcher
clap_complete = "4.6"
clap_complete_nushell = "4.6"
clap_mangen = "0.3"
futures = { version = "0.3", default-features = false, features = ["executor"] }
icns = { version = "0.5", default-features = false, features = ["pngio"] }
kurbo = "0.13"
resvg = { version = "0.49", default-features = false }

[profile.dev.package."*"]
opt-level = 3
