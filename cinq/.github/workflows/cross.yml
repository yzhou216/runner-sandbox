on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cross: # For other systems, from the Nix packages named after them
    name: cinq for ${{ matrix.host }} built on ${{ matrix.system }}
    strategy:
      fail-fast: false
      matrix:
        system: [x86_64-linux]
        host: [aarch64-darwin, x86_64-windows, aarch64-windows, riscv64-linux, x86_64-freebsd]
        include:
          - system: x86_64-linux
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@main
      - uses: wimpysworld/nothing-but-nix@main
      - uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          nix build .#${{ matrix.host }}
          name=cinq-${{ matrix.host }}-built-on-${{ matrix.system }}
          if [ -e result/bin/cinq.exe ]; then
            cp result/bin/cinq.exe "$name.exe" # Program alone, all that Windows needs
            echo "artifact=$name.exe" >> "$GITHUB_ENV"
          else
            tar -cf "$name.tar" -C result .
            echo "artifact=$name.tar" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@main
        with:
          path: ${{ env.artifact }}
          archive: false
