on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packages: # For other distributions of GNU/Linux
    name: packages built on ${{ matrix.system }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            system: x86_64-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@main
      - uses: wimpysworld/nothing-but-nix@main
      - uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          nix build .#deb .#rpm .#archlinux
          cp result*/* .
      - uses: actions/upload-artifact@main
        with:
          name: cinq-${{ matrix.system }}-packages
          path: |
            cinq_*.deb
            cinq-*.rpm
            cinq-*.pkg.tar.zst
