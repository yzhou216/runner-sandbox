on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: cinq built on ${{ matrix.system }}
    strategy:
      fail-fast: false # Failure on one system leaves the other running
      matrix:
        include:
          - os: ubuntu-latest
            system: x86_64-linux
          - os: macos-latest
            system: aarch64-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@main
      - uses: wimpysworld/nothing-but-nix@main
      - uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix flake check
      - run: nix build && tar -cf cinq-${{ matrix.system }}.tar -C result . # Tar keeps the modes and links that artifacts lose
      - uses: actions/upload-artifact@main
        with:
          path: cinq-${{ matrix.system }}.tar
          archive: false
  riscv64-linux: # Cargo of the runner's Ubuntu, since Nix would build every package there
    name: cinq built on riscv64-linux
    runs-on: ubuntu-24.04-riscv
    steps:
      - uses: actions/checkout@main
      - run: | # ALSA's own library in place of the image's from OSS 4, which libasound2-dev conflicts with
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev scdoc liboss4-salsa-asound2-
      - uses: actions/cache@main
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            target/
          key: cargo-riscv64-linux-${{ hashFiles('Cargo.lock') }}
      - run: cargo test --release --locked
      - run: |
          cargo build --release --locked
          mkdir -p cinq/bin
          cp target/release/cinq cinq/bin
          cp -r target/share cinq
          tar -cf cinq-riscv64-linux.tar -C cinq .
      - uses: actions/upload-artifact@main
        with:
          path: cinq-riscv64-linux.tar
          archive: false
  x86_64-freebsd: # Cargo of FreeBSD in a virtual machine, as no runner has FreeBSD
    name: cinq built on x86_64-freebsd
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - uses: vmactions/freebsd-vm@main
        with:
          mem: 12288
          prepare: pkg install -y rust scdoc pkgconf alsa-lib
          run: |
            export CARGO_TARGET_DIR=/var/tmp/target # Outside the files that come back from the machine
            cargo test --release --locked
            cargo build --release --locked
            mkdir -p cinq/bin
            cp "$CARGO_TARGET_DIR/release/cinq" cinq/bin
            cp -R target/share cinq
            tar -cf cinq-x86_64-freebsd.tar -C cinq .
      - uses: actions/upload-artifact@main
        with:
          path: cinq-x86_64-freebsd.tar
          archive: false
  cross: # For other systems, from the Nix packages named after them
    name: cinq for ${{ matrix.host }} built on ${{ matrix.system }}
    strategy:
      fail-fast: false
      matrix:
        system: [x86_64-linux]
        host: [aarch64-darwin, x86_64-windows, aarch64-windows, riscv64-linux, x86_64-freebsd]
        include:
          - system: x86_64-linux
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@main
      - uses: wimpysworld/nothing-but-nix@main
      - uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          nix build .#${{ matrix.host }}
          name=cinq-${{ matrix.host }}-built-on-${{ matrix.system }}
          if [ -e result/bin/cinq.exe ]; then
            cp result/bin/cinq.exe "$name.exe" # Program alone, all that Windows needs
            echo "artifact=$name.exe" >> "$GITHUB_ENV"
          else
            tar -cf "$name.tar" -C result .
            echo "artifact=$name.tar" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@main
        with:
          path: ${{ env.artifact }}
          archive: false
  packages: # For other distributions of GNU/Linux
    name: packages built on ${{ matrix.system }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            system: x86_64-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@main
      - uses: wimpysworld/nothing-but-nix@main
      - uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          nix build .#deb .#rpm .#archlinux
          cp result*/* .
      - uses: actions/upload-artifact@main
        with:
          name: cinq-${{ matrix.system }}-packages
          path: |
            cinq_*.deb
            cinq-*.rpm
            cinq-*.pkg.tar.zst
