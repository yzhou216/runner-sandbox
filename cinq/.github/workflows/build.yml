on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false # Failure on one system leaves the other running
      matrix:
        include:
          - os: ubuntu-latest
            system: x86_64-linux
          - os: macos-latest
            system: aarch64-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@main
      - uses: wimpysworld/nothing-but-nix@main
      - uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix flake check
      - run: nix build && tar -cf cinq-${{ matrix.system }}.tar -C result . # Tar keeps the modes and links that artifacts lose
      - uses: actions/upload-artifact@main
        with:
          path: cinq-${{ matrix.system }}.tar
          archive: false
  packages: # Built on Ubuntu for Darwin, Windows, and other distributions of GNU/Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - uses: wimpysworld/nothing-but-nix@main
      - uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          nix build .#aarch64-darwin-cross .#deb .#rpm .#archlinux
          tar -cf cinq-aarch64-darwin-cross.tar -C result .
          cp result-*/* .
          nix build .#x86_64-windows-cross .#aarch64-windows-cross
          cp result/bin/cinq.exe cinq-x86_64-windows.exe
          cp result-1/bin/cinq.exe cinq-aarch64-windows.exe
      - uses: actions/upload-artifact@main
        with:
          path: cinq-aarch64-darwin-cross.tar
          archive: false
      - uses: actions/upload-artifact@main
        with:
          name: packages
          path: |
            cinq_*.deb
            cinq-*.rpm
            cinq-*.pkg.tar.zst
      - uses: actions/upload-artifact@main
        with:
          path: cinq-x86_64-windows.exe
          archive: false
      - uses: actions/upload-artifact@main
        with:
          path: cinq-aarch64-windows.exe
          archive: false
