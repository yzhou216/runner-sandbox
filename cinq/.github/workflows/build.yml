on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: cinq built on ${{ matrix.system }}
    strategy:
      fail-fast: false # Failure on one system leaves the other running
      matrix:
        include:
          - os: ubuntu-latest
            system: x86_64-linux
          - os: macos-latest
            system: aarch64-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@main
      - uses: wimpysworld/nothing-but-nix@main
      - uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix flake check
      - run: nix build && tar -cf cinq-${{ matrix.system }}.tar -C result . # Tar keeps the modes and links that artifacts lose
      - uses: actions/upload-artifact@main
        with:
          path: cinq-${{ matrix.system }}.tar
          archive: false
  packages: # For Darwin, Windows, and other distributions, each named after where it runs, then after where it was built
    name: packages built on ${{ matrix.system }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            system: x86_64-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@main
      - uses: wimpysworld/nothing-but-nix@main
      - uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          nix build .#aarch64-darwin .#deb .#rpm .#archlinux
          tar -cf cinq-aarch64-darwin-built-on-${{ matrix.system }}.tar -C result .
          cp result-*/* .
          nix build .#x86_64-windows .#aarch64-windows
          cp result/bin/cinq.exe cinq-x86_64-windows-built-on-${{ matrix.system }}.exe
          cp result-1/bin/cinq.exe cinq-aarch64-windows-built-on-${{ matrix.system }}.exe
      - uses: actions/upload-artifact@main
        with:
          path: cinq-aarch64-darwin-built-on-${{ matrix.system }}.tar
          archive: false
      - uses: actions/upload-artifact@main
        with:
          name: cinq-${{ matrix.system }}-packages
          path: |
            cinq_*.deb
            cinq-*.rpm
            cinq-*.pkg.tar.zst
      - uses: actions/upload-artifact@main
        with:
          path: cinq-x86_64-windows-built-on-${{ matrix.system }}.exe
          archive: false
      - uses: actions/upload-artifact@main
        with:
          path: cinq-aarch64-windows-built-on-${{ matrix.system }}.exe
          archive: false
