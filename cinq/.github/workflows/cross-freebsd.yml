on: [push, pull_request, workflow_dispatch]
permissions: {contents: read}
jobs:
  build:
    name: cinq for ${{ matrix.host }} built on ${{ matrix.system }}
    strategy:
      fail-fast: false
      matrix:
        system: [x86_64-linux, aarch64-linux]
        host: [x86_64-freebsd, aarch64-freebsd]
        include:
          - {system: x86_64-linux, os: ubuntu-latest}
          - {system: aarch64-linux, os: ubuntu-24.04-arm}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@main
      - uses: wimpysworld/nothing-but-nix@main
      - uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@master
        with:
          name: yzhou216
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          pushFilter: -cinq- # cinq's own builds, which change with every commit
      - run: |
          nix build .#${{ matrix.host }}
          tar -cf cinq-${{ matrix.host }}-built-on-${{ matrix.system }}.tar -C result .
          mkdir run # Store paths that it needs, for the run below on a machine without Nix
          readlink -f result > run/path.txt
          nix-store -qR result | tar -cf run/closure.tar -T -
      - uses: actions/upload-artifact@main
        with:
          path: cinq-${{ matrix.host }}-built-on-${{ matrix.system }}.tar
          archive: false
      - uses: actions/upload-artifact@main
        with:
          name: run-${{ matrix.host }}-built-on-${{ matrix.system }}
          path: run
          retention-days: 1
  run:
    name: cinq for ${{ matrix.host }} built on ${{ matrix.system }}, run on ${{ matrix.host }}
    needs: build
    if: ${{ !cancelled() }} # Builds that succeeded still run when another failed
    strategy:
      fail-fast: false
      matrix:
        system: [x86_64-linux, aarch64-linux]
        host: [x86_64-freebsd, aarch64-freebsd]
        include:
          - {host: x86_64-freebsd, arch: x86_64}
          - {host: aarch64-freebsd, arch: aarch64} # Emulated, as no runner has KVM for aarch64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@main
        with:
          name: run-${{ matrix.host }}-built-on-${{ matrix.system }}
      - uses: vmactions/freebsd-vm@main
        with:
          arch: ${{ matrix.arch }}
          copyback: false
          run: |
            tar -xf closure.tar -C /
            "$(cat path.txt)/bin/cinq" --version
