on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: cinq for aarch64-darwin built on ${{ matrix.system }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {system: x86_64-linux, os: ubuntu-latest}
          - {system: aarch64-linux, os: ubuntu-24.04-arm}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@main
      - uses: wimpysworld/nothing-but-nix@main
      - uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix build .#aarch64-darwin && tar -cf cinq-aarch64-darwin-built-on-${{ matrix.system }}.tar -C result . # Tar keeps the modes and links that artifacts lose
      - uses: actions/upload-artifact@main
        with:
          path: cinq-aarch64-darwin-built-on-${{ matrix.system }}.tar
          archive: false
  run:
    name: cinq for aarch64-darwin built on ${{ matrix.system }}, run on aarch64-darwin
    needs: build
    if: ${{ !cancelled() }} # Builds that succeeded still run when another failed
    strategy:
      fail-fast: false
      matrix:
        system: [x86_64-linux, aarch64-linux]
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@main
        with:
          name: cinq-aarch64-darwin-built-on-${{ matrix.system }}.tar
      - run: |
          mkdir cinq
          tar -xf cinq-aarch64-darwin-built-on-${{ matrix.system }}.tar -C cinq
          cinq/bin/cinq --version
