# Four outputs that fill the eight channels of the Dante device of cinq, on
# the device of Inferno itself, which takes 32-bit integers, and a cue that
# sends where new cues send: to House alone

[[output]]
name = "House"
device = "alsa:inferno_cinq"
device_name = "Inferno"
channels = "1-2"
new_cues = 0.0

[[output]]
name = "Sub"
device = "alsa:inferno_cinq"
device_name = "Inferno"
channels = "3"

[[output]]
name = "Monitors"
device = "alsa:inferno_cinq"
device_name = "Inferno"
channels = "5-6"

[[output]]
name = "Lobby"
device = "alsa:inferno_cinq"
device_name = "Inferno"
channels = "7-8"

[[list]]
name = "Main"

[[list.cue]]
id = 1
number = "1"
kind = "audio"
name = "Music"
file = "music.flac"
