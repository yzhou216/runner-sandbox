# Walks through usage.cinq.toml in cinq by the steps of steps.txt, with the
# main window and the stage side by side, on GNU/Linux, Darwin, and Windows,
# and records the screen of each
on: push
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      # Commit before wimpysworld/nothing-but-nix#56, whose TMPDIR under /nix
      # makes the installer of Nix 2.35.4 fail with permission denied
      - uses: wimpysworld/nothing-but-nix@baf7355748bb5651f08b839669d6bb39051b2874
      - uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Make the sounds and videos of the show
        run: |
          mkdir show
          cp usage.cinq.toml show/
          ffmpeg() { nix shell nixpkgs#ffmpeg -c ffmpeg -loglevel error "$@"; }
          video=(-c:v libx264 -profile:v high -pix_fmt yuv420p)
          ffmpeg -f lavfi -i "aevalsrc=0.15*sin(2*PI*262*t)+0.15*sin(2*PI*330*t)+0.15*sin(2*PI*(392+2*sin(2*PI*t))*t):d=8" show/preshow.flac
          ffmpeg -f lavfi -i "aevalsrc=0.5*sin(2*PI*880*t)*exp(-3*mod(t\,1.5)):d=3" show/bell.flac
          ffmpeg -f lavfi -i testsrc2=size=960x540:rate=30 -f lavfi -i sine=frequency=440 -t 10 "${video[@]}" -c:a aac show/titles.mp4
          ffmpeg -f lavfi -i mandelbrot=size=960x540:rate=30 -t 8 "${video[@]}" show/scene.mp4
          ffmpeg -f lavfi -i life=size=240x135:rate=30:mold=10:ratio=0.1:death_color=#C83232:life_color=#00ff00 -vf scale=960:540:flags=neighbor -t 6 "${video[@]}" show/interval.mp4
      - name: Cross-build cinq for Windows
        run: |
          nix build ./cinq#x86_64-windows-cross ./cinq#aarch64-windows-cross
          mkdir x86_64 aarch64
          cp result/bin/cinq.exe x86_64/
          cp result-1/bin/cinq.exe aarch64/
      - uses: actions/upload-artifact@main
        with:
          name: show
          path: show
      - uses: actions/upload-artifact@main
        with:
          name: x86_64
          path: x86_64
      - uses: actions/upload-artifact@main
        with:
          name: aarch64
          path: aarch64
  linux:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@main
      # Commit before wimpysworld/nothing-but-nix#56, whose TMPDIR under /nix
      # makes the installer of Nix 2.35.4 fail with permission denied
      - uses: wimpysworld/nothing-but-nix@baf7355748bb5651f08b839669d6bb39051b2874
      - uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@main
        with:
          name: show
          path: show
      - run: nix build ./cinq && nix build --out-link tools nixpkgs#sway nixpkgs#wf-recorder nixpkgs#wtype nixpkgs#grim
      - run: |
          PATH=$(for tool in tools*; do printf '%s/bin:' "$(readlink -f "$tool")"; done)$PATH
          XDG_RUNTIME_DIR=$(mktemp -d)
          export XDG_RUNTIME_DIR WLR_BACKENDS=headless WLR_RENDERER=pixman WLR_LIBINPUT_NO_DEVICES=1
          printf 'output HEADLESS-1 resolution 1920x1080\n' > sway.config
          sway -c sway.config > sway.log 2>&1 &
          sleep 5
          WAYLAND_DISPLAY=$(find "$XDG_RUNTIME_DIR" -maxdepth 1 -name 'wayland-[0-9]' -printf '%f\n' | head -1)
          export WAYLAND_DISPLAY
          (cd show && timeout -k 5 120 ../result/bin/cinq usage.cinq.toml > ../cinq.log 2>&1 &)
          sleep 6
          grim opened.png
          timeout -k 5 70 wf-recorder -D -f usage.mp4 > recorder.log 2>&1 &
          sleep 2
          grep '^[0-9]' steps.txt | while read -r delay action; do
            sleep "$delay"
            case $action in
              go) wtype -s 300 -k space ;;
              panic) wtype -s 300 -k Escape ;;
              next_list) wtype -s 300 -k Right ;;
              help) wtype -s 300 '?' ;;
              close_help) wtype -s 300 q ;;
            esac
          done
          pkill -INT wf-recorder
          sleep 3
          echo "--- cinq"
          cat cinq.log
      - if: always()
        uses: actions/upload-artifact@main
        with:
          name: linux
          path: |
            *.png
            usage.mp4
          if-no-files-found: ignore
  darwin:
    needs: build
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@main
      - uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@main
        with:
          name: show
          path: show
      - run: nix build ./cinq
      - run: |
          open result/Applications/cinq.app --args "$PWD/show/usage.cinq.toml"
          sleep 10
          # Main window and stage side by side, both in sight of the recording
          osascript -e 'tell application "System Events" to tell process "cinq"' \
            -e 'set position of window "usage.cinq.toml - cinq" to {0, 30}' \
            -e 'set size of window "usage.cinq.toml - cinq" to {560, 700}' \
            -e 'set position of window "usage.cinq.toml stage - cinq" to {560, 30}' \
            -e 'set size of window "usage.cinq.toml stage - cinq" to {464, 300}' \
            -e 'end tell' || echo "windows stay put"
          sleep 2
          screencapture -x opened.png
          screencapture -x -V 52 usage.mov &
          sleep 2
          press() { osascript -e "tell application \"System Events\" to $1"; }
          grep '^[0-9]' steps.txt | while read -r delay action; do
            sleep "$delay"
            case $action in
              go) press 'keystroke " "' ;;
              panic) press 'key code 53' ;;
              next_list) press 'key code 124' ;;
              help) press 'keystroke "?"' ;;
              close_help) press 'keystroke "q"' ;;
            esac
          done
          wait
          pkill -x cinq
      - if: always()
        uses: actions/upload-artifact@main
        with:
          name: darwin
          path: |
            *.png
            usage.mov
          if-no-files-found: ignore
  windows:
    needs: build
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, arch: x86_64 }
          - { os: windows-11-arm, arch: aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@main
      - uses: actions/download-artifact@main
        with:
          name: ${{ matrix.arch }}
      - uses: actions/download-artifact@main
        with:
          name: show
          path: show
      - run: choco install ffmpeg -y --no-progress > choco.log
      - shell: pwsh
        run: ./usage.ps1
      - if: always()
        uses: actions/upload-artifact@main
        with:
          name: windows-${{ matrix.arch }}
          path: |
            *.png
            usage.mp4
            err.txt
          if-no-files-found: ignore
