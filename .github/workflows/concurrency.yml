# Looks for the parts of cinq's video output that would gain from more
# threads, with rayon or otherwise, and tests what came of it.  Earlier runs
# of this branch timed them with bench/ (see README.md).  This run tests the
# snapshot in cinq/, cinq's master at ec61ead with its pictures converted
# in words of two pixels: each runner runs its tests beside those of
# ec61ead, two of which fail on Windows, runs clippy, and plays each clip in
# real time through the video output of ec61ead, of the snapshot, and of
# the snapshot with rust_h264's threaded decoder, by realtime/run.sh.
on: push
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  clips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: mkdir clips && bash bench/clips.sh clips
      - uses: actions/upload-artifact@v7
        with:
          name: clips
          path: clips
  cinq:
    needs: clips
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    env:
      CINQ_SHARE_DIR: '' # No manual pages, which need scdoc
      CARGO_TARGET_DIR: ${{ github.workspace }}/target-shared # Dependencies built once for every tree
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: clips
          path: clips
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config
      - name: Test the snapshot, and cinq at ec61ead
        run: |
          git clone -q https://github.com/yzhou216/cinq base
          git -C base checkout -q ec61eadfa4d75a258054d1967e2242f3abdd8fad
          for tree in cinq base; do
            (cd "$tree" && cargo test --release --locked 2>&1) > "test-$tree.log" || true
            echo "$tree: $(grep -E '^test result' "test-$tree.log" | tr -d '\r' | tr '\n' ' ')"
          done
          failed() { grep -E '^test .* \.\.\. FAILED' "$1" | tr -d '\r' | sort || true; }
          echo "failing at ec61ead:"
          failed test-base.log
          new=$(comm -23 <(failed test-cinq.log) <(failed test-base.log))
          if [ -n "$new" ]; then
            echo "failing with the snapshot alone:"
            echo "$new"
            exit 1
          fi
          grep -q '^test result' test-cinq.log
      - name: Clippy on the snapshot
        if: '!cancelled()'
        working-directory: cinq
        run: |
          cargo clippy --release --locked --all-targets 2>&1 | tee ../clippy.log
          grep -A8 'video/decoder/color' ../clippy.log || echo "no warnings in color.rs"
      - name: Play the clips in real time
        if: '!cancelled()'
        run: |
          {
            echo "# ${{ matrix.os }}"
            echo
            bash realtime/run.sh clips
          } 2>&1 | tee "realtime-${{ matrix.os }}.txt"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cinq-${{ matrix.os }}
          path: |
            test-*.log
            clippy.log
            realtime-*.txt
          if-no-files-found: ignore
