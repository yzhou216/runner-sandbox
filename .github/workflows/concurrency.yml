# Looks for the parts of cinq's video output that would gain from more
# threads, with rayon or otherwise: bench/ times the conversion of decoded
# pictures to RGBA, passes through clips of x264 that bench/clips.sh makes,
# and the drawing of each new picture with tiny-skia, each as cinq does it
# at ec61ead and as it could, on every kind of runner.  Run 42422493908
# timed the conversion, the drawing, and passes through clips far past the
# bitrates of real video; this run times kernels of the conversion that
# vectorize on x86-64, and passes through clips at realistic bitrates.
on: push
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  clips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: mkdir clips && bash bench/clips.sh clips
      - uses: actions/upload-artifact@v7
        with:
          name: clips
          path: clips
  bench:
    needs: clips
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: clips
          path: clips
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --manifest-path bench/Cargo.toml
      - name: Benchmark
        run: |
          bench=bench/target/release/cinq-bench
          {
            echo "# ${{ matrix.os }}"
            echo
            # shellcheck disable=SC2016 # PowerShell expands $env itself
            case $RUNNER_OS in
              Linux) lscpu | grep -E '^(Model name|CPU\(s\)):' ;;
              macOS) sysctl -n machdep.cpu.brand_string hw.ncpu ;;
              Windows) powershell -NoProfile -Command '(Get-CimInstance Win32_Processor).Name; $env:NUMBER_OF_PROCESSORS' ;;
            esac
            echo
            if [ "$RUNNER_OS" = macOS ]; then
              "$bench" convert
            fi
            "$bench" kernels
            BENCH_REPEAT=2 "$bench" pass clips/*.mp4
          } | tee "bench-${{ matrix.os }}.md"
          cat "bench-${{ matrix.os }}.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Time the kernels built for x86-64-v3, with AVX2
        if: runner.arch == 'X64'
        env:
          RUSTFLAGS: -C target-cpu=x86-64-v3
          CARGO_TARGET_DIR: bench/target-v3
        run: |
          cargo build --release --manifest-path bench/Cargo.toml
          {
            echo "# ${{ matrix.os }}, x86-64-v3"
            echo
            bench/target-v3/release/cinq-bench kernels
          } | tee "bench-${{ matrix.os }}-v3.md"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-${{ matrix.os }}
          path: bench-*.md
          if-no-files-found: ignore
  riscv64:
    needs: clips
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: clips
          path: clips
      - run: cargo build --release --manifest-path bench/Cargo.toml
      - name: Benchmark
        env:
          BENCH_REPEAT: 1
        run: |
          bench=bench/target/release/cinq-bench
          {
            echo "# ubuntu-24.04-riscv"
            echo
            lscpu | grep -E '^(Model name|CPU\(s\)|ISA):' || true
            echo
            "$bench" kernels
            "$bench" pass clips/1080p.mp4 clips/1080p30-grain.mp4
          } | tee bench-riscv64.md
          cat bench-riscv64.md >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-riscv64
          path: bench-*.md
          if-no-files-found: ignore
