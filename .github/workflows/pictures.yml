# Walks through pictures.cinq.toml in cinq by the steps of steps.txt on
# GNU/Linux, with a control display and a projector, and on Darwin and
# Windows, with one display, and records the screens: a preshow picture
# goes up fullscreen, a film covers it as it fades out, the fullscreen key
# brings the stage back to a window, and the next picture goes up
# fullscreen again until a panic
on: push
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      # Commit before wimpysworld/nothing-but-nix#56, whose TMPDIR under /nix
      # makes the installer of Nix 2.35.4 fail with permission denied
      - uses: wimpysworld/nothing-but-nix@baf7355748bb5651f08b839669d6bb39051b2874
      - uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Make the pictures and the film of the show
        run: |
          mkdir show
          cp pictures.cinq.toml show/
          FONT=$(nix build --no-link --print-out-paths nixpkgs#dejavu_fonts)/share/fonts/truetype/DejaVuSans.ttf
          export FONT
          nix shell nixpkgs#ffmpeg -c bash media.sh
      - name: Cross-build cinq for Windows
        run: |
          nix build ./cinq#x86_64-windows-cross ./cinq#aarch64-windows-cross
          mkdir x86_64 aarch64
          cp result/bin/cinq.exe x86_64/
          cp result-1/bin/cinq.exe aarch64/
      - uses: actions/upload-artifact@main
        with:
          name: show
          path: show
      - uses: actions/upload-artifact@main
        with:
          name: x86_64
          path: x86_64
      - uses: actions/upload-artifact@main
        with:
          name: aarch64
          path: aarch64
  linux:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@main
      # Commit before wimpysworld/nothing-but-nix#56, whose TMPDIR under /nix
      # makes the installer of Nix 2.35.4 fail with permission denied
      - uses: wimpysworld/nothing-but-nix@baf7355748bb5651f08b839669d6bb39051b2874
      - uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@main
        with:
          name: show
          path: show
      - run: nix build ./cinq && nix build --out-link tools nixpkgs#sway nixpkgs#wf-recorder nixpkgs#wtype nixpkgs#grim nixpkgs#ffmpeg
      - run: |
          PATH=$(for tool in tools*; do printf '%s/bin:' "$(readlink -f "$tool")"; done)$PATH
          XDG_RUNTIME_DIR=$(mktemp -d)
          export XDG_RUNTIME_DIR WLR_BACKENDS=headless WLR_RENDERER=pixman WLR_LIBINPUT_NO_DEVICES=1
          # Control display on the left, and a projector on the right, which
          # the stage moves to as it opens
          printf '%s\n' \
            'output HEADLESS-1 resolution 1280x720 position 0 0' \
            'output HEADLESS-2 resolution 1280x720 position 1280 0' \
            'for_window [title=" stage - cinq$"] move container to output HEADLESS-2' \
            'default_border none' > sway.config
          sway -c sway.config > sway.log 2>&1 &
          sleep 5
          WAYLAND_DISPLAY=$(find "$XDG_RUNTIME_DIR" -maxdepth 1 -name 'wayland-[0-9]' -printf '%f\n' | head -1)
          SWAYSOCK=$(find "$XDG_RUNTIME_DIR" -maxdepth 1 -name 'sway-ipc.*' | head -1)
          export WAYLAND_DISPLAY SWAYSOCK
          swaymsg create_output
          sleep 1
          (cd show && timeout -k 5 120 ../result/bin/cinq pictures.cinq.toml > ../cinq.log 2>&1 &)
          sleep 6
          grim -o HEADLESS-1 opened-control.png
          grim -o HEADLESS-2 opened-projector.png
          timeout -k 5 60 wf-recorder -D -o HEADLESS-1 -f control.mp4 > control.log 2>&1 &
          timeout -k 5 60 wf-recorder -D -o HEADLESS-2 -f projector.mp4 > projector.log 2>&1 &
          sleep 2
          grep '^[0-9]' steps.txt | while read -r delay action; do
            sleep "$delay"
            case $action in
              go) wtype -s 300 -k space ;;
              fullscreen) wtype -s 300 -k F11 ;;
              panic) wtype -s 300 -k Escape ;;
            esac
            stage=$(swaymsg -t get_tree -r | tr -d ' \n' | grep -o '"name":"[^"]*stage-cinq","[^}]*' | grep -o '"fullscreen_mode":[0-9]' | head -1)
            echo "$delay $action: stage $stage"
          done
          pkill -INT wf-recorder
          sleep 3
          ffmpeg -loglevel error -i control.mp4 -i projector.mp4 -filter_complex '[0]fps=30[a];[1]fps=30[b];[a][b]hstack=shortest=1,scale=1920:-2' -c:v libx264 -pix_fmt yuv420p pictures.mp4
          echo "--- cinq"
          cat cinq.log
      - if: always()
        uses: actions/upload-artifact@main
        with:
          name: linux
          path: |
            *.png
            pictures.mp4
          if-no-files-found: ignore
  darwin:
    needs: build
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@main
      - uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@main
        with:
          name: show
          path: show
      - run: nix build ./cinq
      - run: |
          open result/Applications/cinq.app --args "$PWD/show/pictures.cinq.toml"
          sleep 10
          stage='window "pictures.cinq.toml stage - cinq"'
          # Main window and stage side by side, both in sight of the recording
          osascript -e 'tell application "System Events" to tell process "cinq"' \
            -e 'set position of window "pictures.cinq.toml - cinq" to {0, 30}' \
            -e 'set size of window "pictures.cinq.toml - cinq" to {560, 700}' \
            -e "set position of $stage to {560, 30}" \
            -e "set size of $stage to {464, 300}" \
            -e 'end tell' || echo "windows stay put"
          sleep 2
          screencapture -x opened.png
          screencapture -x -V 34 pictures.mov &
          sleep 2
          # System Events can lose the stage for a moment while Darwin moves it
          # between spaces, which the log tells rather than ending the step
          press() { osascript -e "tell application \"System Events\" to $1" || echo "System Events failed: $1"; }
          grep '^[0-9]' steps.txt | while read -r delay action; do
            sleep "$delay"
            case $action in
              go) press 'keystroke " "' ;;
              # F11 is Show Desktop on Darwin, so the green button's way
              fullscreen) press "tell process \"cinq\" to set value of attribute \"AXFullScreen\" of $stage to false" ;;
              panic) press 'key code 53' ;;
            esac
            full=$(osascript -e "tell application \"System Events\" to tell process \"cinq\" to get value of attribute \"AXFullScreen\" of $stage" 2>&1 || true)
            echo "$delay $action: stage fullscreen $full"
          done
          wait
          pkill -x cinq
      - if: always()
        uses: actions/upload-artifact@main
        with:
          name: darwin
          path: |
            *.png
            pictures.mov
          if-no-files-found: ignore
  windows:
    needs: build
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, arch: x86_64 }
          - { os: windows-11-arm, arch: aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@main
      - uses: actions/download-artifact@main
        with:
          name: ${{ matrix.arch }}
      - uses: actions/download-artifact@main
        with:
          name: show
          path: show
      - run: choco install ffmpeg -y --no-progress > choco.log
      - shell: pwsh
        run: ./pictures.ps1
      - if: always()
        uses: actions/upload-artifact@main
        with:
          name: windows-${{ matrix.arch }}
          path: |
            *.png
            pictures.mp4
            err.txt
          if-no-files-found: ignore
