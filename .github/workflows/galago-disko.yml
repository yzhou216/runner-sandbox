name: galago disko
on:
  push:
    paths:
      - galago-disko/**
defaults:
  run:
    shell: bash
env:
  FLAKE_BASE: 7f2b444fc34ffc4b5c37a046c3c9509848095350
  DISKO_BASE: 6747342da148f6cb28c8405a70fe00455a0ba027
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@main
      - uses: wimpysworld/nothing-but-nix@main
        with:
          hatchet-protocol: rampage
      - name: Let QEMU use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
            extra-substituters = https://nix-community.cachix.org https://yzhou216.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= yzhou216.cachix.org-1:O7nGwQnLGGBGE8zYFMipVzPVN956FcV57y9SqwEP+O8=
      - name: Check out the flake with the changes under test
        run: |
          git config --global user.name runner
          git config --global user.email runner@localhost
          git clone --quiet https://github.com/nix-community/disko "$RUNNER_TEMP/disko"
          cd "$RUNNER_TEMP/disko"
          git fetch --quiet origin pull/1277/head
          git checkout --quiet "$DISKO_BASE"
          git apply --index "$GITHUB_WORKSPACE/galago-disko/disko.patch"
          git commit --quiet -m "galago-disko: fix under test"
          disko="git+file://$PWD?rev=$(git rev-parse HEAD)"
          git clone --quiet https://github.com/yzhou216/flake "$RUNNER_TEMP/flake"
          cd "$RUNNER_TEMP/flake"
          git checkout --quiet "$FLAKE_BASE"
          git apply --index "$GITHUB_WORKSPACE/galago-disko/flake.patch"
          nix flake lock --override-input disko "$disko"
          git commit --quiet --all -m "galago-disko: changes under test"
          echo "FLAKE=git+file://$PWD?rev=$(git rev-parse HEAD)" >>"$GITHUB_ENV"
      - name: Build the installer, galago, and its disko script
        run: galago-disko/test.sh build
      - name: Boot the installer
        run: galago-disko/test.sh installer
      - name: Install galago with nixos-anywhere
        run: galago-disko/test.sh install
      - name: Boot galago from its disk, entering the passphrase once
        run: galago-disko/test.sh boot
      - name: Check the disk layout
        run: galago-disko/test.sh check
      - name: Boot again with the stock unlock units of NixOS
        run: galago-disko/test.sh stock
      - name: Collect logs
        if: always()
        run: galago-disko/test.sh collect
      - uses: actions/upload-artifact@main
        if: always()
        with:
          name: galago-disko
          path: galago-disko.tar
          if-no-files-found: ignore
