on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: cinq built on ${{ matrix.system }}
    strategy:
      fail-fast: false # Failure on one system leaves the others running
      matrix:
        include:
          - os: ubuntu-latest
            system: x86_64-linux
          - os: ubuntu-24.04-arm
            system: aarch64-linux
          - os: macos-latest
            system: aarch64-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@main
      - uses: wimpysworld/nothing-but-nix@main
      - uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix flake check
      - run: nix build && tar -cf cinq-${{ matrix.system }}.tar -C result . # Tar keeps the modes and links that artifacts lose
      - uses: actions/upload-artifact@main
        with:
          path: cinq-${{ matrix.system }}.tar
          archive: false
  riscv64-linux: # Off until RISE's kernel loads the compiler of Nixpkgs' bootstrap tools, https://github.com/riseproject-dev/riscv-runner/issues/138
    name: cinq built on riscv64-linux
    if: false
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 4320 # Everything from source, as cache.nixos.org holds next to nothing for riscv64
    steps:
      - uses: actions/checkout@main
      - uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix flake check
      - run: nix build && tar -cf cinq-riscv64-linux.tar -C result .
      - uses: actions/upload-artifact@main
        with:
          path: cinq-riscv64-linux.tar
          archive: false
  x86_64-freebsd: # Off while Nix of FreeBSD's packages aborts every builder with structured attributes
    name: cinq built on x86_64-freebsd
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - uses: vmactions/freebsd-vm@main
        with:
          mem: 13312
          prepare: pkg install -y nix git ca_root_nss
          run: |
            chown -R root:wheel "$GITHUB_WORKSPACE" # Nix opens only repositories that the user owns
            export NIX_CONFIG='experimental-features = nix-command flakes
            build-users-group =
            sandbox = false
            ssl-cert-file = /usr/local/share/certs/ca-root-nss.crt'
            nix flake check
            nix build
            tar -cf cinq-x86_64-freebsd.tar -C result .
      - uses: actions/upload-artifact@main
        with:
          path: cinq-x86_64-freebsd.tar
          archive: false
