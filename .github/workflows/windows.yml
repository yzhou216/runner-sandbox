# cinq's light and network cues on Windows, x86_64 and aarch64, with
# listen.py and fakeeos.py on the same computer, and ETC Eos offline under
# x64 emulation beside aarch64 cinq.  Each phase uploads what it found,
# since a runner that loses its connection uploads nothing more.
name: cinq on Windows
on: push
permissions:
  actions: read
  contents: read
env:
  CINQ: github:yzhou216/cinq/1a2198013d7e4a7122b90c4141ca5285096a5df9
defaults:
  run:
    shell: bash
jobs:
  build:
    if: github.run_attempt == 0 # skipped, ran in 43693917753
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-windows, aarch64-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Commit before wimpysworld/nothing-but-nix#56, whose TMPDIR under /nix
      # makes the installer of Nix 2.35.4 fail with permission denied
      - uses: wimpysworld/nothing-but-nix@baf7355748bb5651f08b839669d6bb39051b2874
      - uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          nix build "$CINQ#${{ matrix.target }}"
          mkdir cinq-windows && cp -rL result/. cinq-windows/ && find cinq-windows
      - uses: actions/upload-artifact@v4
        with:
          name: cinq-${{ matrix.target }}
          path: cinq-windows
  # Light cues and network cues, driven with SendKeys
  cues:
    needs: build
    if: github.run_attempt == 0 # skipped, ran in 43693917753
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-windows
          - os: windows-11-arm
            target: aarch64-windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cinq-${{ matrix.target }}
          path: cinq-windows
      - name: Clear the desktop of windows-11-arm
        if: matrix.os == 'windows-11-arm'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File eos/prep.ps1
      - name: Light cues and network cues
        run: powershell -NoProfile -ExecutionPolicy Bypass -File eos/test.ps1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cues-${{ matrix.target }}
          path: out
  # Eos, an x86_64 program, under the emulation of windows-11-arm
  eos:
    needs: build
    if: github.run_attempt == 0 # skipped, ran in 43693917753
    runs-on: windows-11-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cinq-aarch64-windows
          path: cinq-windows
      - name: Clear the desktop
        run: powershell -NoProfile -ExecutionPolicy Bypass -File eos/prep.ps1
      - name: Download Eos
        run: |
          curl -sSfL -o eos.zip https://cdn.etcconnect.com/ETC_EosFamily_v3.3.10.28.zip
          7z x eos.zip
          # shellcheck disable=SC2016 # $PLUGINSDIR is a directory in the archive
          7z x -oeos-parts ETC_EosFamily_v3.3.10.28.exe '$PLUGINSDIR/ETC_EosFamily_v3.3.10.28.msi' \
            '$PLUGINSDIR/VC_redist.x64.exe' '$PLUGINSDIR/VC_redist.x86.exe' '$PLUGINSDIR/vcredist_2005_sp1_vc8_x86.exe'
      - name: Install
        timeout-minutes: 20
        run: powershell -NoProfile -ExecutionPolicy Bypass -File eos/install.ps1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eos-install
          path: out
      - name: Start
        timeout-minutes: 15
        run: powershell -NoProfile -ExecutionPolicy Bypass -File eos/start.ps1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eos-start
          path: out
      - name: Program Eos over OSC
        timeout-minutes: 5
        run: powershell -NoProfile -ExecutionPolicy Bypass -File eos/program.ps1 steps-3.txt
      - name: cinq fires Eos cues with network cues
        timeout-minutes: 8
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File eos/beside.ps1 network.toml 6
          sleep 10
          powershell -NoProfile -ExecutionPolicy Bypass -File eos/snap.ps1 fired
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eos-fired
          path: out
  # The prompt of Windows Defender Firewall for a program that listens, and
  # what answers it
  firewall:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Clear the desktop of windows-11-arm
        if: matrix.os == 'windows-11-arm'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File eos/prep.ps1
      - name: Firewall prompt of a listening program
        run: powershell -NoProfile -ExecutionPolicy Bypass -File eos/firewall.ps1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firewall-${{ matrix.os }}
          path: out
