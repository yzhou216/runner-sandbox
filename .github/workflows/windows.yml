# Eight checks of cinq c9408b4b490e on windows-latest and windows-11-arm,
# with cinq cross-built on ubuntu-latest
name: cinq on Windows
on: push
permissions:
  actions: read
  contents: read
env:
  CINQ: github:yzhou216/cinq/c9408b4b490ef3e26cd5e27048b09981f3f52f48
defaults:
  run:
    shell: bash
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-windows, aarch64-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Commit before wimpysworld/nothing-but-nix#56
      - uses: wimpysworld/nothing-but-nix@baf7355748bb5651f08b839669d6bb39051b2874
      - uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          nix build "$CINQ#${{ matrix.target }}"
          mkdir cinq-windows && cp -rL result/. cinq-windows/ && find cinq-windows
      - uses: actions/upload-artifact@v4
        with:
          name: cinq-${{ matrix.target }}
          path: cinq-windows
  checks:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-windows
          - os: windows-11-arm
            target: aarch64-windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cinq-${{ matrix.target }}
          path: cinq-windows
      - name: Make the sounds
        run: mkdir win/sounds && python win/sounds.py win/sounds
      - name: Clear the desktop of windows-11-arm
        if: matrix.os == 'windows-11-arm'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File win/prep.ps1
      - name: Eight checks
        run: powershell -NoProfile -ExecutionPolicy Bypass -File win/test.ps1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checks-${{ matrix.target }}
          path: out
