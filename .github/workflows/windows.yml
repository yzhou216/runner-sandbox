# Eight checks of cinq OLD (e304bd4e5) and NEW (efa362c0f) on windows-latest
# and windows-11-arm, with cinq cross-built on ubuntu-latest
name: cinq on Windows
on: push
permissions:
  actions: read
  contents: read
defaults:
  run:
    shell: bash
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        build: [old, new]
        target: [x86_64-windows, aarch64-windows]
        include:
          - build: old
            sha: e304bd4e581af53fa32c5ae9a598c2d655130e61
          - build: new
            sha: efa362c0f5193bc3bd73bbc4494284fa6c6429ce
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Commit before wimpysworld/nothing-but-nix#56
      - uses: wimpysworld/nothing-but-nix@baf7355748bb5651f08b839669d6bb39051b2874
      - uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          nix build "github:yzhou216/cinq/${{ matrix.sha }}#${{ matrix.target }}"
          mkdir cinq-windows && cp -rL result/. cinq-windows/ && find cinq-windows
      - uses: actions/upload-artifact@v4
        with:
          name: cinq-${{ matrix.build }}-${{ matrix.target }}
          path: cinq-windows
  checks:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - {build: old, os: windows-latest, target: x86_64-windows}
          - {build: new, os: windows-latest, target: x86_64-windows}
          - {build: old, os: windows-11-arm, target: aarch64-windows}
          - {build: new, os: windows-11-arm, target: aarch64-windows}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cinq-${{ matrix.build }}-${{ matrix.target }}
          path: cinq-windows
      - name: Make the sounds
        run: mkdir win/sounds && python win/sounds.py win/sounds
      - name: Clear the desktop of windows-11-arm
        if: matrix.os == 'windows-11-arm'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File win/prep.ps1
      - name: Eight checks
        run: powershell -NoProfile -ExecutionPolicy Bypass -File win/test.ps1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checks-${{ matrix.build }}-${{ matrix.target }}
          path: out
