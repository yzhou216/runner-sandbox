# Checks the rebuilt history of yzhou216/rv64_cpu, which rebuild/rebuild.py
# wrote on the laptop from the private repository of project06: every test
# program in Digital on every commit, against rebuild/matrix.expected, and
# nix flake check on the commit that adds the flake, which has no CI yet.
on: push
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  EXPECTED: 81d61f4d4e99aa54e3c7e91a3d944cc6d2b8fad8
  NIXPKGS: github:NixOS/nixpkgs/2074cc672349f14240fb7ea90d509e0b643e9dd4
jobs:
  matrix:
    name: Every program on every commit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: wimpysworld/nothing-but-nix@v12
      - uses: cachix/install-nix-action@v31
      - uses: actions/checkout@v7
      - name: Clone rv64_cpu
        run: |
          git clone https://github.com/yzhou216/rv64_cpu "$RUNNER_TEMP/rc"
          test "$(git -C "$RUNNER_TEMP/rc" rev-parse master)" = "$EXPECTED"
      - name: Run the programs
        run: |
          digital=$(nix build --no-link --print-out-paths "$NIXPKGS#digital")
          jre=$(nix build --no-link --print-out-paths "$NIXPKGS#jre")
          python3 -I rebuild/progtests.py > "$RUNNER_TEMP/tests.dig"
          JAVA=$jre/bin/java JAR=$digital/share/java/Digital.jar TESTS=$RUNNER_TEMP/tests.dig \
            rebuild/matrix.sh "$RUNNER_TEMP/rc" | tee matrix.out
          diff -u rebuild/matrix.expected matrix.out
  flake:
    name: nix flake check of the flake commit on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: wimpysworld/nothing-but-nix@v12
      - uses: cachix/install-nix-action@v31
      - name: Check the commit that adds the flake
        run: |
          git clone https://github.com/yzhou216/rv64_cpu "$RUNNER_TEMP/rc"
          rev=$(git -C "$RUNNER_TEMP/rc" rev-list --reverse master | sed -n 42p)
          git -C "$RUNNER_TEMP/rc" log -1 --format='%H %s' "$rev"
          nix flake check -L "git+file://$RUNNER_TEMP/rc?rev=$rev"
