# Cross-builds cinq for Windows on GNU/Linux from the tree in cinq/, whose
# thread of sound on WASAPI keeps its usual priority, and from the tree in
# cinq-rt/, built with cpal's feature realtime, which asks Windows to
# schedule it for audio, then plays each on VB-CABLE on busy processors
# with stress.ps1, and counts the quarters of a second that a glitch
# spoils.
on: push
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@main
      # Commit before wimpysworld/nothing-but-nix#56, whose TMPDIR under /nix
      # makes the installer of Nix 2.35.4 fail with permission denied
      - uses: wimpysworld/nothing-but-nix@baf7355748bb5651f08b839669d6bb39051b2874
      - uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            extra-substituters = https://yzhou216.cachix.org
            extra-trusted-public-keys = yzhou216.cachix.org-1:O7nGwQnLGGBGE8zYFMipVzPVN956FcV57y9SqwEP+O8=
      - name: Cross-build both trees of cinq for Windows
        run: |
          mkdir -p exe/usual exe/realtime
          nix build --out-link usual ./cinq#x86_64-windows
          cp "$(find -L usual -name cinq.exe -print -quit)" exe/usual/
          nix build --out-link realtime ./cinq-rt#x86_64-windows
          cp "$(find -L realtime -name cinq.exe -print -quit)" exe/realtime/
          ls -l exe/*
      - uses: actions/upload-artifact@main
        with:
          name: exe
          path: exe
  windows:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@main
      - uses: actions/download-artifact@main
        with:
          name: exe
          path: exe
      - uses: LABSN/sound-ci-helpers@v1
      - name: Start Windows Audio and install the recorders
        shell: pwsh
        run: |
          Set-Service Audiosrv -StartupType Automatic
          Start-Service Audiosrv
          choco install ffmpeg -y --no-progress | Select-Object -Last 2
          python -m pip install --quiet soundcard numpy
          (Get-CimInstance Win32_Processor).NumberOfLogicalProcessors
      - name: Play on busy processors with and without scheduling for audio
        shell: pwsh
        run: |
          $env:PATH = "C:\ProgramData\chocolatey\bin;$env:PATH"
          ./stress.ps1 out usual=exe/usual/cinq.exe realtime=exe/realtime/cinq.exe
      - name: Count the quarters that a glitch spoils
        if: always()
        run: |
          export PATH="/c/ProgramData/chocolatey/bin:$PATH"
          notch=",bandreject=f=1000:width_type=h:w=300"
          for name in usual realtime; do
            echo "--- $name: threads of cinq"
            cat "out/$name-threads.txt" || true
            printf '%s\t%s\t%s\t' "$name" "$(bash levels.sh "out/$name.wav" 1 9.5 || true)" \
              "$(bash glitch.sh "out/$name.wav" 1 1000 1 9.5 || true)"
            ffmpeg -hide_banner -f wav -i "out/$name.wav" \
              -af "pan=mono|c0=c0,aformat=sample_fmts=dbl$notch$notch$notch$notch,atrim=start=1:end=9.5,asetnsamples=n=12000,astats=metadata=1:reset=1,ametadata=mode=print:key=lavfi.astats.1.RMS_level:file=-" \
              -f null - 2> /dev/null | sed -n 's/^lavfi.astats.1.RMS_level=//p' |
              awk '$1 > -80 { spoiled++ } END { printf "%d of %d quarters spoiled\n", spoiled, NR }'
          done | tee out/realtime.tsv
      - if: always()
        uses: actions/upload-artifact@main
        with:
          name: windows
          path: out
          if-no-files-found: ignore
