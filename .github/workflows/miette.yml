# Records cinq reporting the problems of its config.toml, drawn by miette on
# standard error and listed in its sidebar, as vim edits the file while cinq
# runs, in headless sway on GNU/Linux, with demo.sh
on: push
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@main
      # Commit before wimpysworld/nothing-but-nix#56, whose TMPDIR under /nix
      # makes the installer of Nix 2.35.4 fail with permission denied
      - uses: wimpysworld/nothing-but-nix@baf7355748bb5651f08b839669d6bb39051b2874
      - uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build cinq and the tools that record it
        run: |
          nix build ./cinq
          nix build --inputs-from ./cinq --out-link fonts nixpkgs#dejavu_fonts
          nix build --inputs-from ./cinq --out-link tools nixpkgs#sway nixpkgs#foot \
            nixpkgs#vim nixpkgs#wtype nixpkgs#wf-recorder nixpkgs#ffmpeg
      - name: Record
        run: |
          PATH=$(for tool in tools*; do printf '%s/bin:' "$(readlink -f "$tool")"; done)$PWD/result/bin:$PATH
          bash demo.sh "$(readlink -f fonts)/share/fonts" videos
      - if: always()
        uses: actions/upload-artifact@main
        with:
          name: videos
          path: videos
          if-no-files-found: ignore
