# Cross-builds cinq of the tree in cinq/ for Windows on GNU/Linux, with
# ASIO and open-timing.patch, which logs how long each opening of a device
# takes, then plays it under the quirks of Windows audio devices with
# quirks.ps1, and prints the level of each channel and how clean the tone
# stayed in each take, with glitch.sh.
on: push
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@main
      # Commit before wimpysworld/nothing-but-nix#56, whose TMPDIR under /nix
      # makes the installer of Nix 2.35.4 fail with permission denied
      - uses: wimpysworld/nothing-but-nix@baf7355748bb5651f08b839669d6bb39051b2874
      - uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            extra-substituters = https://yzhou216.cachix.org
            extra-trusted-public-keys = yzhou216.cachix.org-1:O7nGwQnLGGBGE8zYFMipVzPVN956FcV57y9SqwEP+O8=
      - name: Cross-build cinq for Windows
        run: |
          # Times of each opening of a device, on standard error
          git apply --directory=cinq open-timing.patch
          nix build --out-link result ./cinq#x86_64-windows
          mkdir exe
          cp "$(find -L result -name cinq.exe | head -1)" exe/
          ls -l exe
      - uses: actions/upload-artifact@main
        with:
          name: exe
          path: exe
  windows:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@main
      - uses: actions/download-artifact@main
        with:
          name: exe
          path: exe
      - uses: LABSN/sound-ci-helpers@v1
      - name: Start Windows Audio, install FlexASIO and the recorders
        shell: pwsh
        run: |
          Set-Service Audiosrv -StartupType Automatic
          Start-Service Audiosrv
          choco install ffmpeg -y --no-progress | Select-Object -Last 2
          python -m pip install --quiet soundcard numpy
          Invoke-WebRequest -OutFile FlexASIO.exe `
            https://github.com/dechamps/FlexASIO/releases/download/flexasio-1.10b/FlexASIO-1.10b.exe
          Start-Process -Wait FlexASIO.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          Copy-Item FlexASIO.toml (Join-Path $env:USERPROFILE 'FlexASIO.toml')
      - name: Play under the quirks of Windows audio devices
        shell: pwsh
        run: |
          $env:PATH = "C:\ProgramData\chocolatey\bin;$env:PATH"
          ./quirks.ps1 -Cinq exe/cinq.exe -Out out
      - name: Measure each take
        if: always()
        run: |
          export PATH="/c/ProgramData/chocolatey/bin:$PATH"
          printf 'take\tlevels of the channels\ttone\tlowest quarter\trest below the tone\n'
          for take in asio-Int32 asio-Int16 asio-Int24 asio-Float32 asio-buffer-64 asio-buffer-441 \
            asio-buffer-480 asio-buffer-4096 fallback stopped; do
            file=out/$take.wav
            printf '%s\t%s\t%s\n' "$take" "$(bash levels.sh "$file" 0.5 4.5 || true)" \
              "$(bash glitch.sh "$file" 1 1000 0.5 4.5 || true)"
          done | tee out/takes.tsv
          for log in out/cinq-*.txt; do
            echo "--- $log: openings of devices"
            cat "$log"
          done
      - if: always()
        uses: actions/upload-artifact@main
        with:
          name: windows-quirks
          path: out
          if-no-files-found: ignore
