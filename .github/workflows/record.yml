# Records Digital running test programs on the processor of
# yzhou216/rv64_cpu on an Xvfb display, with record/record.py, and uploads
# the videos and the last frame of each.
on: push
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  NIXPKGS: github:NixOS/nixpkgs/2074cc672349f14240fb7ea90d509e0b643e9dd4
  REF: cleanup
  PROGRAMS: 8 9 20
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: cachix/install-nix-action@v31
      - uses: actions/checkout@v7
      - name: Install Xvfb, xdotool, and ffmpeg
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb xdotool ffmpeg
      - name: Clone rv64_cpu
        run: |
          git clone --branch "$REF" https://github.com/yzhou216/rv64_cpu "$RUNNER_TEMP/rc"
          git -C "$RUNNER_TEMP/rc" log -1 --format='%H %s'
      - name: Record
        run: |
          digital=$(nix build --no-link --print-out-paths "$NIXPKGS#digital")
          Xvfb :99 -screen 0 1920x1080x24 &
          export DISPLAY=:99
          sleep 3
          # shellcheck disable=SC2086 # The programs split into arguments
          python3 -I record/record.py "$RUNNER_TEMP/rc" out "$JAVA_HOME_21_X64/bin/java" \
            "$digital/share/java/Digital.jar" $PROGRAMS
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: videos
          path: out/
