name: milestone-1
on: push
defaults:
  run:
    shell: bash
env:
  CARGO_TERM_COLOR: always
jobs:
  # Course CI's checks
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config \
            libasound2-dev libudev-dev libx11-dev libxcursor-dev libxi-dev \
            libxrandr-dev libxkbcommon-dev libwayland-dev mesa-vulkan-drivers
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: milestone-1
      - name: Run fmt check
        working-directory: milestone-1
        run: cargo fmt --check
      - name: Run Clippy
        working-directory: milestone-1
        run: cargo clippy --no-default-features --features ci -- -D warnings
      - name: Run tests
        working-directory: milestone-1
        run: >-
          cargo nextest run --no-default-features --features ci
          --no-fail-fast --retries 2

  # Instructor recordings replayed in test mode, captured frame by frame
  video:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config \
            libasound2-dev libudev-dev libx11-dev libxcursor-dev libxi-dev \
            libxrandr-dev libxkbcommon-dev libwayland-dev mesa-vulkan-drivers \
            libxkbcommon-x11-0 xvfb xdotool ffmpeg
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: milestone-1
      - name: Build
        working-directory: milestone-1
        run: cargo build --locked --features test
      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1024x1024x24 &
          echo DISPLAY=:99 >> "$GITHUB_ENV"
      - name: Record score-deterministic at normal speed
        run: ./record.sh score-deterministic config-deterministic.json true 2
      - name: Record score-deterministic2 at normal speed
        run: ./record.sh score-deterministic2 config-deterministic.json true 2
      - name: Record score-deterministic3 at normal speed
        run: ./record.sh score-deterministic3 config-deterministic.json true 2
      - name: Record score-deterministic4 at normal speed
        run: ./record.sh score-deterministic4 config-deterministic.json true 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: videos
          path: videos/
