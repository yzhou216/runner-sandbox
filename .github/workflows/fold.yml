# Checks the history of yzhou216/rv64_cpu with its cleanups folded in, on
# its branch fold-check: every test program on every commit in Digital,
# against fold/expected, and nix flake check on the commit that adds the
# flake, which has no CI of its own.  The recordings of Digital ran in the
# first run of this branch.
on: push
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  NIXPKGS: github:NixOS/nixpkgs/2074cc672349f14240fb7ea90d509e0b643e9dd4
  BRANCH: fold-check
jobs:
  matrix:
    name: programs on commits ${{ matrix.first }} to ${{ matrix.last }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {first: 1, last: 16}
          - {first: 17, last: 28}
          - {first: 29, last: 36}
          - {first: 37, last: 43}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: cachix/install-nix-action@v31
      - uses: actions/checkout@v7
      - name: Run the programs
        env:
          FIRST: ${{ matrix.first }}
          LAST: ${{ matrix.last }}
        run: |
          git clone -q --branch "$BRANCH" https://github.com/yzhou216/rv64_cpu "$RUNNER_TEMP/rc"
          git -C "$RUNNER_TEMP/rc" log -1 --format='%H %s'
          digital=$(nix build --no-link --print-out-paths "$NIXPKGS#digital")
          mkdir out
          JAVA=$JAVA_HOME_21_X64/bin/java JAR=$digital/share/java/Digital.jar \
            sh fold/matrix.sh "$RUNNER_TEMP/rc" "$FIRST" "$LAST" "$PWD/fold/tests.dig" >"out/$FIRST"
          cat "out/$FIRST"
      - uses: actions/upload-artifact@v7
        with:
          name: matrix-${{ matrix.first }}
          path: out/
  compare:
    name: compare the programs with fold/expected
    needs: matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: matrix-*
          path: out
          merge-multiple: true
      - run: sort -n out/* | diff fold/expected -
  flake:
    name: nix flake check on the commit that adds the flake
    runs-on: ubuntu-latest
    steps:
      - uses: wimpysworld/nothing-but-nix@main
      - uses: cachix/install-nix-action@v31
      - run: |
          git clone -q --branch "$BRANCH" https://github.com/yzhou216/rv64_cpu "$RUNNER_TEMP/rc"
          git -C "$RUNNER_TEMP/rc" checkout -q "$(git -C "$RUNNER_TEMP/rc" rev-list --reverse HEAD | sed -n 42p)"
          git -C "$RUNNER_TEMP/rc" log -1 --format='%H %s'
          nix flake check -L "$RUNNER_TEMP/rc"
