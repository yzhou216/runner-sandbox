# Tests cinq of the tree in cinq/, master at 35afa6b, with a patch that logs
# keys, messages, focus, help text, and device opens to standard error.
#
# The keys (jobs linux, windows, darwin): the keys of Vim and of the cua
# keymap on GNU/Linux, Windows (x86_64 and aarch64), and Darwin, each with
# shows of two cue lists of five memo cues, one of thirty, one of sixty, one
# of named cues, and one of outputs.  Each job uploads the logs and screenshots.
#
# The audio (jobs audio-*): JACK port order past nine (audio-jack), two outputs
# on two devices and Panic, and keys typed while devices open (audio-pulse),
# clamping on devices of integer samples (audio-alsa, in a virtual machine
# with the loopback card, and audio-windows, through FlexASIO), and one output
# on the default device with the outputs view and the Levels tab on Windows
# and Darwin.  No Space and no Escape reaches cinq, except Escape where a
# check needs Panic and nothing else plays.
name: cinq master
on: push
permissions:
  actions: read
  contents: read
defaults:
  run:
    shell: bash
jobs:
  build-windows:
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-windows, aarch64-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # Commit before wimpysworld/nothing-but-nix#56, whose TMPDIR under /nix
      # makes the installer of Nix 2.35.4 fail with permission denied
      - uses: wimpysworld/nothing-but-nix@baf7355748bb5651f08b839669d6bb39051b2874
      - uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          nix build ./cinq#${{ matrix.target }} --print-build-logs
          mkdir cinq-windows && cp -rL result/. cinq-windows/ && find cinq-windows
      - uses: actions/upload-artifact@v4
        with:
          name: cinq-${{ matrix.target }}
          path: cinq-windows
  windows:
    needs: build-windows
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-windows
          - os: windows-11-arm
            target: aarch64-windows
    name: windows (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cinq-${{ matrix.target }}
          path: cinq-windows
      - name: Clear the desktop of windows-11-arm
        if: matrix.os == 'windows-11-arm'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File keys/prep.ps1
      - name: Keys and mouse buttons
        run: powershell -NoProfile -ExecutionPolicy Bypass -File keys/windows.ps1
      - if: always()
        run: bash keys/verdict.sh out | tee out/verdict.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keys-${{ matrix.target }}
          path: out
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: wimpysworld/nothing-but-nix@baf7355748bb5651f08b839669d6bb39051b2874
      - uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build cinq and the tools
        run: |
          nix build --out-link cinq-build ./cinq --print-build-logs
          nix build --inputs-from ./cinq --out-link fonts nixpkgs#dejavu_fonts
          nix build --inputs-from ./cinq --out-link tools nixpkgs#sway nixpkgs#wtype nixpkgs#grim nixpkgs#dbus nixpkgs#xdg-desktop-portal nixpkgs#xdg-desktop-portal-gtk
          nix shell --inputs-from ./cinq nixpkgs#gcc nixpkgs#wayland-scanner -c bash keys/vptr.sh vptr-build
          for link in tools*; do echo "$(readlink -f "$link")/bin" >> "$GITHUB_PATH"; done
          echo "$PWD/vptr-build" >> "$GITHUB_PATH"
          # The share directories hold the portals and their D-Bus services
          echo "PORTAL_SHARE=$(for link in tools*; do printf '%s:' "$(readlink -f "$link")/share"; done)" >> "$GITHUB_ENV"
          echo "$(readlink -f cinq-build)/bin" >> "$GITHUB_PATH"
          echo "FONTS=$(readlink -f fonts)/share/fonts" >> "$GITHUB_ENV"
      - name: Keys and mouse buttons
        run: |
          mkdir out
          { uname -a; nproc; } | tee out/runner.txt
          bash keys/linux.sh "$FONTS" out
      - if: always()
        run: bash keys/verdict.sh out | tee out/verdict.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keys-linux
          path: out
  darwin:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build cinq
        run: |
          nix build ./cinq --print-build-logs
          cp -R result/Applications/cinq.app cinq.app
          chmod -R u+w cinq.app
      - name: Keys and mouse buttons
        run: bash keys/darwin.sh "$PWD/cinq.app" out
      - if: always()
        run: bash keys/verdict.sh out | tee out/verdict.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keys-darwin
          path: out
  audio-jack:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@main
      # Commit before wimpysworld/nothing-but-nix#56, whose TMPDIR under /nix
      # makes the installer of Nix 2.35.4 fail with permission denied
      - uses: wimpysworld/nothing-but-nix@baf7355748bb5651f08b839669d6bb39051b2874
      - uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            extra-substituters = https://yzhou216.cachix.org
            extra-trusted-public-keys = yzhou216.cachix.org-1:O7nGwQnLGGBGE8zYFMipVzPVN956FcV57y9SqwEP+O8=
      - name: Build cinq and the tools of the session
        run: |
          nix build --out-link result-cinq ./cinq
          nix build --out-link tools --inputs-from ./cinq nixpkgs#sway nixpkgs#wtype \
            nixpkgs#ffmpeg nixpkgs#jack2 nixpkgs#jack-example-tools nixpkgs#jack_capture
          nix build --out-link libjack --inputs-from ./cinq nixpkgs#libjack2
      - name: Connect the ports of cinq past the ninth
        run: |
          PATH=$(for tool in tools*; do printf '%s/bin:' "$(readlink -f "$tool")"; done)$PATH
          mkdir sound
          audio/media.sh sound
          # Where cinq finds libjack, as it would in the system's libraries
          export LD_LIBRARY_PATH
          LD_LIBRARY_PATH=$(readlink -f libjack)/lib
          timeout -k 10 300 audio/jack.sh result-cinq/bin/cinq sound out
      - name: Judge the ports
        if: always()
        run: |
          PATH=$(for tool in tools*; do printf '%s/bin:' "$(readlink -f "$tool")"; done)$PATH
          for name in pair singles; do
            audio/levels.sh "out/$name.wav" 0.5 3.5 | tee "out/levels-$name.tsv"
          done
          python3 -I audio/verdict.py jack out | tee out/verdict.txt
      - if: always()
        uses: actions/upload-artifact@main
        with:
          name: audio-jack
          path: out
          if-no-files-found: ignore
  audio-pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@main
      # Commit before wimpysworld/nothing-but-nix#56, whose TMPDIR under /nix
      # makes the installer of Nix 2.35.4 fail with permission denied
      - uses: wimpysworld/nothing-but-nix@baf7355748bb5651f08b839669d6bb39051b2874
      - uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            extra-substituters = https://yzhou216.cachix.org
            extra-trusted-public-keys = yzhou216.cachix.org-1:O7nGwQnLGGBGE8zYFMipVzPVN956FcV57y9SqwEP+O8=
      - name: Build cinq and the tools of the session
        run: |
          nix build --out-link result-cinq ./cinq
          nix build --out-link tools --inputs-from ./cinq nixpkgs#sway nixpkgs#wtype \
            nixpkgs#ffmpeg nixpkgs#pulseaudio
          nix build --out-link alsa-plugins --inputs-from ./cinq nixpkgs#alsa-plugins
      - name: Play on two devices, stop with Panic, and type while devices open
        run: |
          PATH=$(for tool in tools*; do printf '%s/bin:' "$(readlink -f "$tool")"; done)$PATH
          mkdir sound
          audio/media.sh sound
          export ALSA_PLUGIN_DIR
          ALSA_PLUGIN_DIR=$(readlink -f alsa-plugins)/lib/alsa-lib
          timeout -k 10 400 audio/pulse.sh result-cinq/bin/cinq sound out
      - name: Judge the recordings and the log
        if: always()
        run: |
          PATH=$(for tool in tools*; do printf '%s/bin:' "$(readlink -f "$tool")"; done)$PATH
          for take in keys-before keys-after; do
            audio/levels.sh "out/$take.wav" 1 4 > "out/$take.levels.tsv" || true
          done
          python3 -I audio/verdict.py pulse out | tee out/verdict.txt
      - if: always()
        uses: actions/upload-artifact@main
        with:
          name: audio-pulse
          path: out
          if-no-files-found: ignore
  audio-alsa:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@main
      # Commit before wimpysworld/nothing-but-nix#56, whose TMPDIR under /nix
      # makes the installer of Nix 2.35.4 fail with permission denied
      - uses: wimpysworld/nothing-but-nix@baf7355748bb5651f08b839669d6bb39051b2874
      - name: Let the build of Nix use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
            extra-substituters = https://yzhou216.cachix.org
            extra-trusted-public-keys = yzhou216.cachix.org-1:O7nGwQnLGGBGE8zYFMipVzPVN956FcV57y9SqwEP+O8=
      - name: Play loud sounds on hw devices of ALSA in the virtual machine
        run: |
          nix build -L --impure --out-link result-clamp --expr "import ./audio/vm.nix { workspace = \"$PWD\"; }" 2>&1 |
            tail -n 200
          mkdir -p out
          cp -r result-clamp/clamp out/
      - name: Judge the peaks
        if: always()
        run: |
          PATH=$(nix build --no-link --print-out-paths --inputs-from ./cinq nixpkgs#ffmpeg.bin)/bin:$PATH
          python3 -I audio/verdict.py clamp out/clamp | tee out/verdict.txt
      - if: always()
        uses: actions/upload-artifact@main
        with:
          name: audio-alsa
          path: out
          if-no-files-found: ignore
  audio-windows:
    needs: build-windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@main
      - uses: actions/download-artifact@main
        with:
          name: cinq-x86_64-windows
          path: exe
      - uses: LABSN/sound-ci-helpers@v1
      - name: Start Windows Audio, install FlexASIO and the recorders
        shell: pwsh
        run: |
          Set-Service Audiosrv -StartupType Automatic
          Start-Service Audiosrv
          choco install ffmpeg -y --no-progress | Select-Object -Last 2
          python -m pip install --quiet soundcard numpy
          Invoke-WebRequest -OutFile FlexASIO.exe `
            https://github.com/dechamps/FlexASIO/releases/download/flexasio-1.10b/FlexASIO-1.10b.exe
          Start-Process -Wait FlexASIO.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
      - name: Play, press the keys, and play loud on FlexASIO
        shell: pwsh
        run: |
          $env:PATH = "C:\ProgramData\chocolatey\bin;$env:PATH"
          New-Item -ItemType Directory sound | Out-Null
          bash audio/media.sh sound
          audio/windows.ps1 -Cinq exe/bin/cinq.exe -Sound sound -Out out
      - name: Judge the recordings and the log
        if: always()
        run: |
          export PATH="/c/ProgramData/chocolatey/bin:$PATH"
          for take in out/*.wav; do
            bash audio/levels.sh "$take" 1 4 > "${take%.wav}.levels.tsv" || true
          done
          python -I audio/verdict.py windows out | tee out/verdict.txt
      - if: always()
        uses: actions/upload-artifact@main
        with:
          name: audio-windows
          path: out
          if-no-files-found: ignore
  audio-darwin:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@main
      - uses: actions/setup-python@main
        with:
          python-version: "3.13"
      - uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            extra-substituters = https://yzhou216.cachix.org
            extra-trusted-public-keys = yzhou216.cachix.org-1:O7nGwQnLGGBGE8zYFMipVzPVN956FcV57y9SqwEP+O8=
      - name: Install BlackHole, ffmpeg, and sounddevice
        run: |
          brew install --cask blackhole-16ch blackhole-2ch
          brew install ffmpeg switchaudio-osx
          python -m pip install --quiet sounddevice numpy
          sudo killall coreaudiod || true
          sleep 5
          SwitchAudioSource -a -t output
          SwitchAudioSource -s "BlackHole 16ch" -t output || true
      - name: Build cinq
        run: nix build --out-link result-cinq ./cinq
      - name: Play and press the keys
        run: |
          mkdir sound
          audio/media.sh sound
          audio/darwin.sh result-cinq/bin/cinq sound out
      - name: Judge the recordings and the log
        if: always()
        run: |
          for take in out/*.wav; do
            bash audio/levels.sh "$take" 1 4 > "${take%.wav}.levels.tsv" || true
          done
          python -I audio/verdict.py darwin out | tee out/verdict.txt
      - if: always()
        uses: actions/upload-artifact@main
        with:
          name: audio-darwin
          path: out
          if-no-files-found: ignore
