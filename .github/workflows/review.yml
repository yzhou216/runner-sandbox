name: Review
on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize]
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    # Forks skip the review, which needs the LLM_API_KEY secret
    if: github.repository == 'yzhou216/runner-sandbox'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Secrets are exposed here, so never check out the pull request's code
      - uses: aryanbrite/openrabbit@0350c5ff79e6efb3ba92898a46a2e420ae1c526c # main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          llm_api_key: ${{ secrets.LLM_API_KEY }}
          llm_provider: openrouter
          llm_model: openrouter/free
