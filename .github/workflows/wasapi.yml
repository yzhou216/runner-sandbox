# Cross-builds cinq of the tree in cinq/ for Windows on GNU/Linux, then
# plays it on CABLE Input of VB-CABLE, a virtual WASAPI device, with
# wasapi.ps1, which also disables the device and enables it again midway
# through the cue, and prints the level of each channel before and after.
on: push
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@main
      # Commit before wimpysworld/nothing-but-nix#56, whose TMPDIR under /nix
      # makes the installer of Nix 2.35.4 fail with permission denied
      - uses: wimpysworld/nothing-but-nix@baf7355748bb5651f08b839669d6bb39051b2874
      - uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            extra-substituters = https://yzhou216.cachix.org
            extra-trusted-public-keys = yzhou216.cachix.org-1:O7nGwQnLGGBGE8zYFMipVzPVN956FcV57y9SqwEP+O8=
      - name: Cross-build cinq for Windows
        run: |
          nix build --out-link result ./cinq#x86_64-windows
          mkdir exe
          cp "$(find -L result -name cinq.exe | head -1)" exe/
          ls -l exe
      - uses: actions/upload-artifact@main
        with:
          name: exe
          path: exe
  wasapi:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@main
      - uses: actions/download-artifact@main
        with:
          name: exe
          path: exe
      - uses: LABSN/sound-ci-helpers@v1
      - name: Start Windows Audio and install ffmpeg
        shell: pwsh
        run: |
          Set-Service Audiosrv -StartupType Automatic
          Start-Service Audiosrv
          Get-Service Audiosrv, AudioEndpointBuilder
          choco install ffmpeg -y --no-progress | Select-Object -Last 2
          Get-PnpDevice -Class MEDIA | Format-Table -AutoSize
      - name: Play on CABLE Input
        shell: pwsh
        run: |
          $env:PATH = "C:\ProgramData\chocolatey\bin;$env:PATH"
          bash media.sh .
          ./wasapi.ps1 -Cinq exe/cinq.exe -Sound music.flac -Out out
      - name: Measure each channel
        if: always()
        run: |
          export PATH="/c/ProgramData/chocolatey/bin:$PATH"
          command -v ffmpeg
          echo "--- before the device went away"
          bash levels.sh out/before.wav 1 | tee out/levels-before.tsv
          echo "--- after it came back"
          bash levels.sh out/after.wav 1 | tee out/levels-after.tsv
      - if: always()
        uses: actions/upload-artifact@main
        with:
          name: wasapi
          path: out
          if-no-files-found: ignore
