# Plays cinq.exe of the tree in cinq/, which run 43511163489 of this branch
# cross-built with ASIO on GNU/Linux, with wasapi.ps1 on the playback
# device of VB-CABLE, a virtual WASAPI device, which goes away and comes
# back midway through the cue, and on FlexASIO, an ASIO driver that plays
# on VB-CABLE in 32-bit integers, and prints the level of each channel.
on: push
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@main
      - uses: actions/download-artifact@main
        with:
          name: exe
          run-id: 43511163489
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: exe
      - uses: LABSN/sound-ci-helpers@v1
      - name: Start Windows Audio, install FlexASIO and the recorders
        shell: pwsh
        run: |
          Set-Service Audiosrv -StartupType Automatic
          Start-Service Audiosrv
          choco install ffmpeg -y --no-progress | Select-Object -Last 2
          python -m pip install --quiet soundcard numpy
          Invoke-WebRequest -OutFile FlexASIO.exe `
            https://github.com/dechamps/FlexASIO/releases/download/flexasio-1.10b/FlexASIO-1.10b.exe
          Start-Process -Wait FlexASIO.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          Copy-Item FlexASIO.toml (Join-Path $env:USERPROFILE 'FlexASIO.toml')
      - name: Play on VB-CABLE, which goes away and comes back
        shell: pwsh
        run: |
          $env:PATH = "C:\ProgramData\chocolatey\bin;$env:PATH"
          bash media.sh .
          ./wasapi.ps1 -Cinq exe/cinq.exe -Sound music.flac -Out out/wasapi -Match '^wasapi:.*VB-Audio' -Revive
      - name: Play on FlexASIO
        if: always()
        shell: pwsh
        run: |
          $env:PATH = "C:\ProgramData\chocolatey\bin;$env:PATH"
          ./wasapi.ps1 -Cinq exe/cinq.exe -Sound music.flac -Out out/asio -Match '^asio:'
      - name: Measure each channel
        if: always()
        run: |
          export PATH="/c/ProgramData/chocolatey/bin:$PATH"
          for take in wasapi/before wasapi/after asio/before; do
            echo "--- $take"
            bash levels.sh "out/$take.wav" 1 | tee "out/$take.tsv" || true
          done
      - if: always()
        uses: actions/upload-artifact@main
        with:
          name: windows
          path: out
          if-no-files-found: ignore
