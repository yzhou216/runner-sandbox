# Plays cinq of the tree in cinq/ on the playback device of VB-CABLE, a
# virtual WASAPI device, with wasapi.ps1, which also disables the device
# and enables it again midway through the cue, and prints the level of
# each channel before and after.  cinq.exe comes from run 43465503910 of
# this branch, which cross-built the same tree on GNU/Linux.
on: push
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
jobs:
  wasapi:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@main
      - uses: actions/download-artifact@main
        with:
          name: exe
          path: exe
          run-id: 43465503910
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: LABSN/sound-ci-helpers@v1
      - name: Start Windows Audio and install the recorders
        shell: pwsh
        run: |
          Set-Service Audiosrv -StartupType Automatic
          Start-Service Audiosrv
          Get-Service Audiosrv, AudioEndpointBuilder
          choco install ffmpeg -y --no-progress | Select-Object -Last 2
          python -m pip install --quiet soundcard numpy
      - name: Play on VB-CABLE
        shell: pwsh
        run: |
          $env:PATH = "C:\ProgramData\chocolatey\bin;$env:PATH"
          bash media.sh .
          ./wasapi.ps1 -Cinq exe/cinq.exe -Sound music.flac -Out out
      - name: Measure each channel
        if: always()
        run: |
          export PATH="/c/ProgramData/chocolatey/bin:$PATH"
          cat out/before.log out/after.log || true
          echo "--- before the device went away"
          bash levels.sh out/before.wav 1 | tee out/levels-before.tsv
          echo "--- after it came back"
          bash levels.sh out/after.wav 1 | tee out/levels-after.tsv
      - if: always()
        uses: actions/upload-artifact@main
        with:
          name: wasapi
          path: out
          if-no-files-found: ignore
