# Records cinq while keys fire a start, a pause, and a GoTo cue, with the
# sound and a graph of its level.  The tools of the session come from the
# nixpkgs of the same commit as cinq, so that the recording is repeatable.
on: push
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  CINQ: 631ebe10cf16318d29e6bd9fce80cf7e82f32c99
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        name: [control-cues]
    steps:
      - uses: actions/checkout@main
      # Commit before wimpysworld/nothing-but-nix#56, whose TMPDIR under /nix
      # makes the installer of Nix 2.35.4 fail with permission denied
      - uses: wimpysworld/nothing-but-nix@baf7355748bb5651f08b839669d6bb39051b2874
      - uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            extra-substituters = https://yzhou216.cachix.org
            extra-trusted-public-keys = yzhou216.cachix.org-1:O7nGwQnLGGBGE8zYFMipVzPVN956FcV57y9SqwEP+O8=
      - name: Build cinq and the tools
        run: |
          nix build --out-link result-cinq "github:yzhou216/cinq/$CINQ"
          nix build --out-link tools --inputs-from "github:yzhou216/cinq/$CINQ" \
            nixpkgs#sway-unwrapped nixpkgs#wtype nixpkgs#wf-recorder nixpkgs#grim \
            nixpkgs#pulseaudio nixpkgs#ffmpeg-headless nixpkgs#gawk
          nix build --out-link alsa-plugins --inputs-from "github:yzhou216/cinq/$CINQ" nixpkgs#alsa-plugins
          nix build --out-link fonts --inputs-from "github:yzhou216/cinq/$CINQ" nixpkgs#dejavu_fonts
          ls -d tools* result-cinq alsa-plugins fonts
      - name: Record cinq and compose the video
        run: |
          mkdir -p logs
          PATH=$(for tool in tools*; do printf '%s/bin:' "$(readlink -f "$tool")"; done)$PATH
          export ALSA_PLUGIN_DIR FONTS
          ALSA_PLUGIN_DIR=$(readlink -f alsa-plugins)/lib/alsa-lib
          FONTS=$(readlink -f fonts)/share/fonts
          # Every command goes to the log, which the artifact keeps on failure
          bash -x live/run.sh result-cinq "${{ matrix.name }}" "out/${{ matrix.name }}" 2>&1 |
            tee "logs/${{ matrix.name }}.log"
      - if: always()
        uses: actions/upload-artifact@main
        with:
          name: ${{ matrix.name }}
          path: |
            out
            logs
          if-no-files-found: ignore
