# Tells whether Nix from FreeBSD's packages builds cinq natively on
# x86_64-freebsd within the six hours of a job, with no cache but
# cache.nixos.org, which holds no build for FreeBSD.  Run 42412315915 tried
# it with a nix.conf that Nix did not read.
on:
  push:
    paths: [.github/workflows/freebsd-nix.yml]
permissions:
  contents: read
jobs:
  native:
    name: cinq built by Nix on x86_64-freebsd
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@main
      - uses: vmactions/freebsd-vm@main
        with:
          mem: 13312
          prepare: |
            pkg install -y nix git perl5 bash ca_root_nss
            nix --version
          run: |
            chown -R root:wheel "$GITHUB_WORKSPACE" # Nix opens only repositories that the user owns
            sysctl -n hw.ncpu
            df -h /
            export NIX_CONFIG='experimental-features = nix-command flakes
            ssl-cert-file = /usr/local/share/certs/ca-root-nss.crt
            build-users-group =
            sandbox = false
            max-jobs = auto
            cores = 0'
            nix config show | grep -E '^(experimental-features|build-users-group|sandbox|max-jobs|cores|system) '
            bash -o pipefail -c '
              start=$SECONDS
              status=0
              timeout -s INT 19800 nix build -L --keep-going ./cinq 2>&1 | perl scripts/timed.pl build.log || status=$?
              echo "took $((SECONDS - start)) seconds, ending with $status"
              perl scripts/summary.pl build.log
              df -h /
              gzip -f build.log
              exit "$status"
            '
      - if: always()
        uses: actions/upload-artifact@main
        with:
          name: log-x86_64-freebsd-native
          path: build.log.gz
          if-no-files-found: ignore
