# Tells what aborts with exit code 134 when Nix from FreeBSD's packages
# builds Nixpkgs' stdenv for x86_64-freebsd natively, as every builder with
# structured attributes did in run 42424765105: the smallest derivation with
# structured attributes and without, built by FreeBSD's own bash, then one
# of the bootstrap's builds that aborted, kept, with the kernel's record of
# the program that aborted and a backtrace from its core.  Run 42439851240
# found that the bootstrap tools' find aborts in configurePhase, on
# find . -iname ltmain.sh -print0, and run 42440065618 that it aborts on
# --version as well, along with xargs, sed, and tar, while grep and bash
# run (run 42440261391), so this tries clean environments and truss.
on:
  push:
    paths: [.github/workflows/freebsd-nix.yml]
permissions:
  contents: read
jobs:
  probe:
    name: Nix from FreeBSD's packages, aborting builders
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@main
      - uses: vmactions/freebsd-vm@main
        with:
          mem: 13312
          copyback: false
          prepare: |
            pkg install -y nix git bash ca_root_nss gdb
            nix --version
          run: |
            chown -R root:wheel "$GITHUB_WORKSPACE"
            freebsd-version
            sysctl kern.corefile kern.coredump
            export NIX_CONFIG='experimental-features = nix-command flakes
            build-users-group =
            sandbox = false
            ssl-cert-file = /usr/local/share/certs/ca-root-nss.crt'
            for s in false true; do
              echo "== structured attributes: $s"
              nix build --no-link -L --print-out-paths --impure --expr "import ./scripts/structured.nix { structured = $s; }" && echo "built" || echo "failed with $?"
            done
            drv=$(nix eval --raw ./cinq#packages.x86_64-freebsd.cinq.drvPath)
            flags=$(nix-store -qR "$drv" | grep -m1 -- '-add-flags.sh.drv$')
            echo "== $flags"
            nix derivation show "$flags" | head -c 3000
            echo
            dmesg -c > /dev/null 2>&1 || true
            nix build --no-link -L --keep-failed "$flags^*" 2>&1 | grep -a -E "Abort|keeping|structuredAttrs" || true
            archive=$(nix-store -qR "$drv" | grep -m1 -- "-bootstrap-archive.drv\$" | xargs nix-store -q --outputs)
            find_=$archive/bin/find
            echo "== $find_"
            file "$find_"
            set +e
            ldd "$find_"
            cd /tmp
            "$find_" --version; echo "find --version ended with $?"
            echo "== environments"
            env -i "$find_" --version > /dev/null; echo "env -i: $?"
            env -i LANG=C.UTF-8 "$find_" --version > /dev/null; echo "LANG=C.UTF-8: $?"
            env -i LC_ALL=C "$find_" --version > /dev/null; echo "LC_ALL=C: $?"
            echo "== truss of find --version"
            truss "$find_" --version 2>&1 | tail -45
            echo "== other bootstrap tools"
            for tool in xargs grep sed tar; do "$archive/bin/$tool" --version > /dev/null 2>&1; echo "$tool ended with $?"; done
            exit 0
