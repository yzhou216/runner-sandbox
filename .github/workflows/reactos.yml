name: reactos
on: push

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, i686]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - name: Build the test programs, as they are and with the shim
        run: nix develop ".#${{ matrix.arch }}" -c ./build.sh "${{ matrix.arch }}" programs
      - uses: actions/upload-artifact@v4
        with:
          name: programs-${{ matrix.arch }}
          path: programs

  imports:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: 0.4.16-x86
            arch: i386
            programs: i686
            revision: 0.4.16
          - image: nightly-x86
            arch: i386
            programs: i686
            revision: faa2d0325a880c8ef56bad1e52e7288176ef9975
          - image: nightly-x64
            arch: amd64
            programs: x86_64
            revision: faa2d0325a880c8ef56bad1e52e7288176ef9975
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - uses: actions/download-artifact@v5
        with:
          name: programs-${{ matrix.programs }}
          path: programs
      - name: List the imports that ReactOS lacks
        run: |
          iso=$(nix develop .#vm -c ./fetch-iso.sh "${{ matrix.image }}" iso)
          nix develop .#vm -c ./check-imports.sh "$iso" "${{ matrix.arch }}" \
            "${{ matrix.revision }}" programs/*.EXE | tee "imports-${{ matrix.image }}.txt"
          { echo '```'; cat "imports-${{ matrix.image }}.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: imports-${{ matrix.image }}
          path: imports-${{ matrix.image }}.txt

  vm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Let the runner user open /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@v31
      - uses: actions/download-artifact@v5
        with:
          name: programs-i686
          path: programs
      - name: Install ReactOS 0.4.16 and run the programs in it
        run: |
          iso=$(nix develop .#vm -c ./fetch-iso.sh 0.4.16-x86 iso)
          nix develop .#vm -c ./vm/run-vm.sh "$iso" i386 programs out
          grep -a ROSTEST out/com1.log | tr -d '\r' | tee out/results.txt
      - name: Make a video of the screenshots
        if: always()
        run: |
          nix develop .#vm -c ffmpeg -loglevel error -framerate 4 -pattern_type glob \
            -i 'out/shots/*.png' -vf 'scale=1024:768:force_original_aspect_ratio=decrease,pad=1024:768:(ow-iw)/2:(oh-ih)/2' \
            -c:v libx264 -pix_fmt yuv420p out/reactos.mp4
          tar -C out -cf out/shots.tar shots
          rm -r out/shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vm-0.4.16-x86
          path: out

  windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: programs-i686
          path: programs-i686
      - uses: actions/download-artifact@v5
        with:
          name: programs-x86_64
          path: programs-x86_64
      - name: Run the programs with the shim on Windows
        shell: pwsh
        run: ./windows.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows
          path: out
