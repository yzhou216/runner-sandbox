on:
  push:
    paths: [.github/workflows/recording.yml, demo.sh, ui.swift, fill.applescript]
defaults:
  run:
    shell: bash
jobs:
  record:
    name: recording of cinq's Darwin package on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@main
      - name: Helper
        run: swiftc -O -o ui ui.swift
      - name: Setup
        run: |
          sw_vers
          # Account for the dialogs that ask for a password: the runner's
          # own if a guess finds its password, or else a new administrator
          # on a machine that lives for this job alone
          for guess in runner vagrant admin password; do
            if dscl . -authonly runner "$guess" 2>/dev/null; then
              echo "found the password of runner: $guess"
              printf 'user=runner\npassword=%s\n' "$guess" >> "$GITHUB_ENV"
              break
            fi
          done
          if ! grep -q ^user= "$GITHUB_ENV"; then
            sudo sysadminctl -addUser cinqdemo -fullName cinqdemo -password cinqdemo -admin
            sudo dscl . -passwd /Users/cinqdemo cinqdemo
            sudo dseditgroup -o edit -a cinqdemo -t user admin
            dscl . -authonly cinqdemo cinqdemo
            dseditgroup -o checkmember -m cinqdemo admin
            printf 'user=cinqdemo\npassword=cinqdemo\n' >> "$GITHUB_ENV"
          fi
          # Full names in Finder, which Vision reads on one line
          defaults write com.apple.finder FXPreferredViewStyle Nlsv
          killall Finder || true
          # Installs with no password dialog, which a script cannot answer
          sudo security authorizationdb write system.install.software allow
          sleep 3
      - name: Recording
        timeout-minutes: 12
        run: ./demo.sh
      - uses: actions/upload-artifact@main
        if: ${{ !cancelled() }}
        with:
          name: recording-${{ matrix.os }}
          path: shots
