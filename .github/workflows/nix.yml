name: Nix platforms
on: push

defaults:
  run:
    shell: bash

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Check and build
        run: |
          nix flake check ./src-tree --print-build-logs
          nix build ./src-tree#default --print-build-logs

  freebsd:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/freebsd-vm@v1
        with:
          prepare: pkg install -y nix
          run: |
            git config --global --add safe.directory "$GITHUB_WORKSPACE"
            export NIX_CONFIG='experimental-features = nix-command flakes'
            nix --version
            nix flake check ./src-tree --print-build-logs
            nix build ./src-tree#default --print-build-logs

  netbsd:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/netbsd-vm@v1
        with:
          release: "10.2"
          prepare: /usr/sbin/pkg_add nix
          run: |
            export NIX_CONFIG='experimental-features = nix-command flakes'
            nix --version
            nix flake check ./src-tree --print-build-logs
            nix build ./src-tree#default --print-build-logs

  openbsd:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/openbsd-vm@v1
        with:
          release: "7.8"
          prepare: pkg_add nix
          run: |
            export NIX_CONFIG='experimental-features = nix-command flakes'
            nix --version
            nix flake check ./src-tree --print-build-logs
            nix build ./src-tree#default --print-build-logs
