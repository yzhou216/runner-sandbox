# Tells whether cinq can be built for FreeBSD on aarch64 and riscv64: by
# Nixpkgs on x86_64 GNU/Linux, which builds its compiler of Rust for
# aarch64-freebsd from source, and with cargo in virtual machines that
# QEMU emulates, and whether the arm64 runners have KVM, with which a
# machine of aarch64 would run at full speed.  builds.yml, which runs
# 42405137740 and 42406449705 ran, tried the builds that cinq takes.
on: push
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  kvm:
    name: KVM on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - run: |
          uname -m
          nproc
          ls -l /dev/kvm || true
          grep -m1 -o -w -E 'vmx|svm' /proc/cpuinfo || true
  nixpkgs:
    name: cinq for aarch64-freebsd built on x86_64-linux by Nixpkgs
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@main
      - uses: wimpysworld/nothing-but-nix@main
      - uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          start=$SECONDS
          NIXPKGS_ALLOW_UNSUPPORTED_SYSTEM=1 nix build --impure -L ./cinq#aarch64-freebsd 2>&1 \
            | perl -MPOSIX -pe '$|=1; $_ = strftime("%T ", localtime) . $_' > build.log \
            || { tail -100 build.log; exit 1; }
          echo "built in $((SECONDS - start)) seconds"
          # First and last line of each derivation's log
          perl -ne 'next unless /^(\S+) ([^ >]+)> /; $f{$2} //= $1; $l{$2} = $1; push @o, $2 unless $s{$2}++;
            END { print "$f{$_} $l{$_} $_\n" for @o }' build.log
          nix shell nixpkgs#file -c file -L result/bin/cinq
          readlink -f result > path.txt
          nix-store -qR result | tar -cf closure.tar -T -
          ls -l closure.tar
      - if: always()
        uses: actions/upload-artifact@main
        with:
          name: nixpkgs-build-log
          path: build.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@main
        with:
          name: closure-aarch64-freebsd
          path: |
            path.txt
            closure.tar
  run-nixpkgs:
    name: cinq for aarch64-freebsd built by Nixpkgs, run on aarch64-freebsd
    needs: nixpkgs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@main
        with:
          name: closure-aarch64-freebsd
      - uses: vmactions/freebsd-vm@main
        with:
          arch: aarch64
          copyback: false
          run: |
            freebsd-version
            uname -m
            tar -xf closure.tar -C /
            cinq=$(cat path.txt)/bin/cinq
            file "$cinq"
            "$cinq" --version
            "$cinq" --help | head -5
  vm:
    name: cinq built on ${{ matrix.arch }}-freebsd, emulated on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            os: ubuntu-latest
          - arch: aarch64
            os: ubuntu-24.04-arm
          - arch: riscv64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@main
      - uses: vmactions/freebsd-vm@main
        with:
          arch: ${{ matrix.arch }}
          mem: 8192
          copyback: false
          prepare: |
            pkg search -x '^rust-[0-9]' || true
            pkg install -y rust scdoc pkgconf alsa-lib
          run: |
            cd cinq
            freebsd-version
            uname -m
            sysctl -n hw.ncpu
            cargo --version
            export CARGO_TARGET_DIR=/var/tmp/target
            start=$(date +%s)
            cargo build --release --locked
            echo "built in $(($(date +%s) - start)) seconds"
            "$CARGO_TARGET_DIR/release/cinq" --version
            start=$(date +%s)
            cargo test --release --locked
            echo "tested in $(($(date +%s) - start)) seconds"
