on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cross: # For other systems, from the Nix packages named after them
    name: cinq for ${{ matrix.host }} built on ${{ matrix.system }}
    strategy:
      fail-fast: false
      matrix:
        system: [x86_64-linux, aarch64-linux]
        host: [x86_64-linux, aarch64-linux, riscv64-linux, aarch64-darwin, x86_64-windows, aarch64-windows, x86_64-freebsd, aarch64-freebsd]
        exclude: # Native builds, which native.yml makes
          - {system: x86_64-linux, host: x86_64-linux}
          - {system: aarch64-linux, host: aarch64-linux}
        include:
          - {system: x86_64-linux, os: ubuntu-latest}
          - {system: aarch64-linux, os: ubuntu-24.04-arm}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@main
      - uses: wimpysworld/nothing-but-nix@main
      - uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          nix build .#${{ matrix.host }}
          name=cinq-${{ matrix.host }}-built-on-${{ matrix.system }}
          mkdir run
          case ${{ matrix.host }} in
            *-windows)
              cp result/bin/cinq.exe "$name.exe" # Program alone, all that Windows needs
              cp result/bin/cinq.exe run
              echo "artifact=$name.exe" >> "$GITHUB_ENV";;
            *)
              tar -cf "$name.tar" -C result .
              echo "artifact=$name.tar" >> "$GITHUB_ENV";;
          esac
          case ${{ matrix.host }} in
            *-darwin) cp "$name.tar" run/cinq.tar;;
            *-linux | *-freebsd) # Store paths that it needs, for a system without Nix
              readlink -f result > run/path.txt
              nix-store -qR result | tar -cf run/closure.tar -T -;;
          esac
      - uses: actions/upload-artifact@main
        with:
          path: ${{ env.artifact }}
          archive: false
      - uses: actions/upload-artifact@main
        with:
          name: run-${{ matrix.host }}-built-on-${{ matrix.system }}
          path: run
          retention-days: 1
  run: # Each build started on its own system
    name: cinq for ${{ matrix.host }} built on ${{ matrix.system }}, run on ${{ matrix.host }}
    needs: cross
    if: ${{ !cancelled() }} # Builds that succeeded still run when another failed
    strategy:
      fail-fast: false
      matrix:
        system: [x86_64-linux, aarch64-linux]
        host: [x86_64-linux, aarch64-linux, riscv64-linux, aarch64-darwin, x86_64-windows, aarch64-windows, x86_64-freebsd, aarch64-freebsd]
        exclude:
          - {system: x86_64-linux, host: x86_64-linux}
          - {system: aarch64-linux, host: aarch64-linux}
        include:
          - {host: x86_64-linux, os: ubuntu-latest, kind: store}
          - {host: aarch64-linux, os: ubuntu-24.04-arm, kind: store}
          - {host: riscv64-linux, os: ubuntu-24.04-riscv, kind: store}
          - {host: aarch64-darwin, os: macos-latest, kind: darwin}
          - {host: x86_64-windows, os: windows-latest, kind: windows}
          - {host: aarch64-windows, os: windows-11-arm, kind: windows}
          - {host: x86_64-freebsd, os: ubuntu-latest, kind: freebsd, arch: x86_64}
          - {host: aarch64-freebsd, os: ubuntu-latest, kind: freebsd, arch: aarch64} # Emulated, as no runner has KVM for aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@main
        with:
          name: run-${{ matrix.host }}-built-on-${{ matrix.system }}
      - if: matrix.kind == 'store'
        run: |
          sudo tar -xf closure.tar -C /
          "$(cat path.txt)/bin/cinq" --version
      - if: matrix.kind == 'darwin'
        run: |
          mkdir cinq
          tar -xf cinq.tar -C cinq
          cinq/bin/cinq --version
      - if: matrix.kind == 'windows'
        run: ./cinq.exe --version
      - if: matrix.kind == 'freebsd'
        uses: vmactions/freebsd-vm@main
        with:
          arch: ${{ matrix.arch }}
          copyback: false
          run: |
            tar -xf closure.tar -C /
            "$(cat path.txt)/bin/cinq" --version
