# Plays cinq of the tree in cinq/, with open-timing.patch, which logs how
# long each opening of a device takes, on BlackHole 16ch and BlackHole 2ch under
# the quirks of Core Audio devices with quirks.sh, and prints the level of
# each channel and how clean the tone stayed in each take, with glitch.sh.
on: push
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  quirks:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@main
      - uses: actions/setup-python@main
        with:
          python-version: "3.13"
      - uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            extra-substituters = https://yzhou216.cachix.org
            extra-trusted-public-keys = yzhou216.cachix.org-1:O7nGwQnLGGBGE8zYFMipVzPVN956FcV57y9SqwEP+O8=
      - name: Install BlackHole 16ch, BlackHole 2ch, ffmpeg, and sounddevice
        run: |
          brew install --cask blackhole-16ch blackhole-2ch
          brew install ffmpeg
          python -m pip install --quiet sounddevice numpy
          sudo killall coreaudiod || true
          sleep 5
      - name: Build cinq
        run: |
          # Times of each opening of a device, on standard error
          git apply --directory=cinq open-timing.patch
          nix build --out-link result-cinq ./cinq
      - name: Play under the quirks of Core Audio
        run: ONLY=rate ./quirks.sh result-cinq/bin/cinq out
      - name: Find the dips of the takes after the change of rate
        if: always()
        run: |
          # Where the level of each 50 ms falls 3 dB or more, in seconds of
          # the host's clock, from the start that capture.py printed
          for take in rate-after rate-after-b; do
            start=$(sed -nE 's/^start ([0-9.]+)$/\1/p' "out/record-$take.log")
            echo "--- $take, started at $start"
            ffmpeg -hide_banner -f wav -i "out/$take.wav" \
              -af "pan=mono|c0=c0,asetnsamples=n=4800,astats=metadata=1:reset=1,ametadata=mode=print:key=lavfi.astats.1.RMS_level:file=-" \
              -f null - 2> /dev/null | sed -n 's/^lavfi.astats.1.RMS_level=//p' |
              awk -v start="$start" '$1 < -33.1 { printf "dip at %.3f s, %.3f s into the take: %s dB\n", start + (NR - 1) * 0.05, (NR - 1) * 0.05, $1 }'
          done
          for log in out/cinq-*.log; do
            echo "--- $log: openings of devices"
            cat "$log"
          done
      - if: always()
        uses: actions/upload-artifact@main
        with:
          name: darwin-quirks
          path: out
          if-no-files-found: ignore
