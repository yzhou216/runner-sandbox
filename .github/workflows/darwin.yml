# The eight checks of round one, and idle, file watch, light news, exit, and byte order
# mark checks, of cinq OLD and NEW on macos-latest, built natively by Nix
name: Darwin idle checks
on: push
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  NEW: github:yzhou216/cinq/16c365b2c189c8e0b0f21e9d8902383a714bb61c
  OLD: github:yzhou216/cinq/d534417e464a5a95823a183a0483a17a230bf3d3
jobs:
  darwin:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest]
    name: ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/cache/restore@v4
        id: apps
        with:
          path: apps
          key: apps-16c365b-d534417
      - name: Check the cached apps
        id: link
        if: steps.apps.outputs.cache-hit == 'true'
        run: |
          mkdir -p out
          otool -L apps/*/Contents/MacOS/cinq | tee out/otool.txt
          if grep -q /nix/store out/otool.txt; then echo nix=true >> "$GITHUB_OUTPUT"; fi
      - name: Build cinq
        if: steps.apps.outputs.cache-hit != 'true' || steps.link.outputs.nix == 'true'
        run: |
          mkdir -p apps out
          for v in old new; do
            ref=$OLD
            [ "$v" = new ] && ref=$NEW
            nix build "$ref#cinq" -o "result-$v" --print-build-logs 2>&1 | tail -n 15 | tee "out/build-$v.txt"
            cp -R "result-$v/Applications/cinq.app" "apps/cinq-$v.app"
            chmod -R u+w "apps/cinq-$v.app"
          done
      - uses: actions/cache/save@v4
        if: steps.apps.outputs.cache-hit != 'true'
        with:
          path: apps
          key: apps-16c365b-d534417
      - name: Helpers
        run: |
          mkdir -p out
          { sw_vers; uname -m; } | tee out/runner.txt
          swiftc -O -o ui darwin/screen.swift
      - name: Round one, NEW
        if: false # done in run 45462049037
        run: bash -x darwin/checks.sh "$PWD/apps/cinq-new.app" out/checks 2> out/checks-trace.txt
      - name: Idle (checks 2 and 3)
        if: false # done in run 45462049037
        run: bash -x darwin/idle.sh "$PWD/apps" out/idle 2> out/idle-trace.txt
      - name: File watch (check 4)
        if: false # done in run 45462049037
        run: bash -x darwin/watch.sh "$PWD/apps" out/watch 2> out/watch-trace.txt
      - name: Light news (check 5)
        if: false # done in run 45462049037
        run: bash -x darwin/light.sh "$PWD/apps" out/light 2> out/light-trace.txt
      - name: Light news again (check 5), with reject routes
        if: false # done in run 45473900709
        run: bash -x darwin/light2.sh "$PWD/apps" out/light2 2> out/light2-trace.txt
      - name: Idle, where the time goes
        if: false # done in run 45473153343
        run: bash -x darwin/idle2.sh "$PWD/apps" out/idle2 2> out/idle2-trace.txt
      - name: Clean exit (check 6)
        if: false # done in run 45473153343
        run: bash -x darwin/exit.sh "$PWD/apps" out/exit 2> out/exit-trace.txt
      - name: Byte order mark (check 7)
        if: always()
        run: bash -x darwin/bom3.sh "$PWD/apps" out/bom3 2> out/bom3-trace.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: darwin-${{ matrix.runner }}
          path: out
