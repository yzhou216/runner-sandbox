# Finds where the Nix daemon puts the directory of a build when
# nothing-but-nix has run and nix.conf sets build-dir = /nix/build, with
# either installer that build-galago.yml of the flake has used.
name: build-dir probe
on:
  push:
    paths:
      - .github/workflows/build-dir-probe.yml
defaults:
  run:
    shell: bash
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        installer: [install-nix-action, nix-installer-action]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: wimpysworld/nothing-but-nix@b2574ec1cf1462bee0a34de0fb6ff11ad3c43cb2 # v12
      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
        if: matrix.installer == 'install-nix-action'
        with:
          extra_nix_config: |
            accept-flake-config = true
            build-dir = /nix/build
      - uses: DeterminateSystems/nix-installer-action@main
        if: matrix.installer == 'nix-installer-action'
        with:
          extra-conf: |
            build-dir = /nix/build
      - name: Show the configuration
        run: |
          nix --version
          cat /etc/nix/nix.conf
          systemctl cat nix-daemon.service 2>/dev/null | grep -v '^#' || true
          sudo systemctl show nix-daemon.service -p Environment 2>/dev/null || true
          df -h / /nix /tmp
      # Without the sandbox, the builder sees the build directory under
      # its real path instead of /build
      - name: Find the directory of a build
        run: |
          out=$(nix build --no-link --print-out-paths --option sandbox false \
            --impure --expr "derivation {
              name = \"build-dir-probe-$RANDOM\";
              system = builtins.currentSystem;
              builder = \"/bin/sh\";
              args = [ \"-c\" \"pwd > \$out\" ];
            }")
          echo "the build ran in $(cat "$out")"
