# Runs cinq's own test suite (cargo test) natively on every kind of
# GitHub-hosted runner and on FreeBSD, to find the tests that fail only
# because of the platform.  The tree under cinq/ is a copy of the tracked
# files of cinq's branch native-tests.  cinq's CI only runs the tests inside
# the Nix build on GNU/Linux and Darwin.
on: push
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    name: cinq tested on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm, macos-latest, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CINQ_SHARE_DIR: '' # No manual pages, which need scdoc
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libwayland-dev libxkbcommon-dev
      - run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version --verbose
          uname -a
      - name: Test cinq
        working-directory: cinq
        run: cargo test --no-fail-fast --locked 2>&1 | tee test.log
      - name: Name the failures
        if: '!cancelled()'
        working-directory: cinq
        run: |
          grep -E '^test result|^test .* FAILED' test.log | tr -d '\r' || true
      - uses: actions/upload-artifact@v7
        if: '!cancelled()'
        with:
          name: test-${{ matrix.os }}
          path: cinq/test.log
  freebsd:
    name: cinq tested on x86_64-freebsd
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: vmactions/freebsd-vm@v1
        with:
          mem: 12288
          copyback: false
          prepare: pkg install -y rust pkgconf alsa-lib
          run: |
            uname -a
            rustc --version --verbose
            cd cinq
            export CINQ_SHARE_DIR=
            export CARGO_TARGET_DIR=/var/tmp/target
            status=0
            cargo test --no-fail-fast --locked > /var/tmp/test.log 2>&1 || status=$?
            cat /var/tmp/test.log
            echo "--- summary"
            grep -E '^test result|^test .* FAILED' /var/tmp/test.log || true
            cd ..
            sh stress.sh "$(ls -t /var/tmp/target/debug/deps/cinq-* | grep -v '\.d$' | head -1)" 300 300 40
            exit $status
  stress:
    name: cinq's tests repeated on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm, macos-latest, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      CINQ_SHARE_DIR: '' # No manual pages, which need scdoc
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libwayland-dev libxkbcommon-dev
      - run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Repeat the tests
        run: |
          exe=$(cd cinq && cargo test --no-run --locked --message-format=json |
            jq -r 'select(.executable != null and .profile.test) | .executable')
          bash stress.sh "$exe" 300 300 40 2>&1 | tee stress.log
      - uses: actions/upload-artifact@v7
        if: '!cancelled()'
        with:
          name: stress-${{ matrix.os }}
          path: stress.log
