# Tests riscv64 support on the branch riscv64 of yzhou216/openh264-rs, a
# fork of ralfbiedert/openh264-rs.  On a RISE RISC-V runner, builds
# openh264-sys2 as upstream's master has it, whose build script panics, and
# then runs the tests of the branch natively, as upstream's CI runs them.
# On ubuntu-latest, takes the steps of the job for riscv64 that the branch
# adds to upstream's CI, a cross build of the tests.
on: push
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  CARGO_TERM_COLOR: always
  MASTER: 5f3637e2a2e4eead27f21816c050a6a9064ad52e
  BRANCH: 9eaf98e9ffe64e16d9812a6edc68d98ab62c81e2
jobs:
  native:
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 240
    steps:
      - name: Show the platform
        run: |
          uname -srm
          grep PRETTY_NAME /etc/os-release
          rustc -vV
          g++ --version | head -1
          command -v riscv64-linux-gnu-gcc
      - uses: actions/checkout@v7
        with:
          repository: ralfbiedert/openh264-rs
          ref: ${{ env.MASTER }}
          path: master
      - name: Build openh264-sys2 as master has it
        working-directory: master
        run: |
          status=0
          cargo build -p openh264-sys2 2>&1 | tee ../master.log || status=$?
          echo "cargo exited with $status"
          grep -n -A1 'panicked' ../master.log || true
      - uses: actions/checkout@v7
        with:
          repository: yzhou216/openh264-rs
          ref: ${{ env.BRANCH }}
          path: branch
          lfs: true
      - name: Test the branch
        working-directory: branch
        run: |
          start=$SECONDS
          status=0
          cargo test --verbose --all-features -- --test-threads=1 --nocapture 2>&1 | tee ../test.log || status=$?
          echo "cargo test exited with $status after $((SECONDS - start)) seconds"
          if [ "$status" -ne 0 ]; then
            # Again without the flags of .cargo/config.toml, which link
            # AddressSanitizer, as upstream's iOS jobs build
            CARGO_ENCODED_RUSTFLAGS='' cargo test --verbose --all-features -- --test-threads=1 --nocapture 2>&1 |
              tee ../test-without-flags.log || true
            exit "$status"
          fi
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native
          path: '*.log'
  cross:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Steps of the job for riscv64gc-unknown-linux-gnu in the branch's
      # .github/workflows/rust.yml
      - uses: actions/checkout@v4
        with:
          repository: yzhou216/openh264-rs
          ref: ${{ env.BRANCH }}
          lfs: true
      - uses: dtolnay/rust-toolchain@1.89
        with:
          components: rustfmt,clippy
          targets: riscv64gc-unknown-linux-gnu
      - uses: awalsh128/cache-apt-pkgs-action@v1.4.3
        with:
          packages: gcc-riscv64-linux-gnu g++-riscv64-linux-gnu
          version: 1.0
      - run: git lfs checkout
      - run: rustc -Vv
      - run: cargo build --verbose --target=riscv64gc-unknown-linux-gnu --tests --all-features
