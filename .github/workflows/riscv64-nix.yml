# Tells why the compiler of Nixpkgs' bootstrap tools for riscv64 crashes
# on the RISE runner.  Run 42422671372 showed that it crashes outside Nix
# as well, on gcc -v alone, on the board of ubuntu-24.04-riscv, whose
# kernel is 5.10 and whose ISA reads rv64imafdcsu.  This runs it under gdb
# there, reads the ISA that the bootstrap tools were built for, and tries
# it on ubuntu-26.04-riscv, which may run another board.  Now it reads the
# program headers of gcc and runs it through its loader.
on:
  push:
    paths: [.github/workflows/riscv64-nix.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  probe:
    name: bootstrap tools of Nixpkgs on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-riscv] # ubuntu-26.04-riscv waited without a runner in run 42423036804
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@main
      - uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          uname -a
          grep -E '^(isa|uarch|mvendorid|marchid|mimpid|hart isa)' /proc/cpuinfo | sort -u
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends gdb binutils file
      - run: | # Bootstrap tools as Nixpkgs fetches them, before the first build that crashes
          nix build --no-link --keep-going --impure --expr "(builtins.getFlake \"git+file://$PWD?dir=cinq\").inputs.nixpkgs.legacyPackages.riscv64-linux.stdenv" 2>&1 | tail -3 || true
          tools=$(find /nix/store -maxdepth 1 -type d -name "*-bootstrap-tools" | grep -E "/[a-z0-9]{32}-bootstrap-tools$" | head -1)
          echo "tools=$tools" >> "$GITHUB_ENV"
          echo "$tools"
      - run: | # Program headers, which on FreeBSD overlapped where patchelf grew the first segment (run 42440632319)
          for tool in gcc bash; do
            echo "== $tool"
            readelf -lW "$tools/bin/$tool" | sed -n "/Program Headers/,/Section to Segment/p"
          done
          "$tools"/lib/ld-linux-riscv64-lp64d.so.1 "$tools/bin/gcc" --version | head -1; echo "gcc through its loader ended with $?"
