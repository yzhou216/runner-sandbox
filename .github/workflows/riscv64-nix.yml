# The GHC bootstrap chain of nixpkgs#591060 (Hugs -> MicroHs -> GHC 6.2.2),
# with the riscv64 support of the yzhou216/nixpkgs branch
# ghc-bootstrap-503150-riscv64, built by Nix itself on a RISE runner.
# cache.nixos.org has next to nothing for riscv64-linux, so Nix first builds
# the stdenv from nixpkgs's riscv64 bootstrap tools.  After each long stretch
# every store path is copied into a file binary cache that actions/cache
# keeps, so that the next push resumes from there even if the runner is lost
# (run 45091613851 lost its runner 37 minutes in, before any save, and run
# 45105648117 during the checkout).  Build output is not streamed, to keep
# the runner's connection quiet; the logs are uploaded at the end.
name: riscv64-nix
on:
  push:
    paths:
      - .github/workflows/riscv64-nix.yml

defaults:
  run:
    shell: bash

permissions:
  contents: read

env:
  G: haskell.compiler.ghc622Bootstrap
  REV: 4ce9145b0825c6f09f82c464c6409a227fc5cd34
  ATTRS: >-
    haskell.compiler.ghc622Bootstrap
    haskell.compiler.ghc622Bootstrap.tests.fixpoint
    haskell.compiler.ghc622Bootstrap.tests.hello
  # The stdenv's bootstrap stages: stage 2 has the xgcc that the bootstrap
  # tools' gcc builds, stage 3 the glibc and stage 4 the final gcc
  STAGE2: stdenv.__bootPackages.stdenv.__bootPackages.stdenv.__bootPackages.stdenv.__bootPackages.stdenv
  STAGE3: stdenv.__bootPackages.stdenv.__bootPackages.stdenv.__bootPackages.stdenv
  STAGE4: stdenv.__bootPackages.stdenv.__bootPackages.stdenv
  # Memory, disk and load every two minutes, run in the background of each
  # build step, so that the log shows the machine's state if the runner is
  # lost
  RESLOG: >-
    while sleep 120; do
    echo "[res] $(date -u +%T)
    mem $(free -m | awk '/^Mem/ { print $3 "M used, " $7 "M available" }'),
    disk $(df -h / | awk 'NR == 2 { print $3 " used, " $4 " free" }'),
    load $(cut -d ' ' -f 1-3 /proc/loadavg)";
    done

jobs:
  chain:
    runs-on: ubuntu-24.04-riscv
    # Under RISE's pod deadline of about six days
    timeout-minutes: 7200
    steps:
      # The address layout matters to 6.2.2's fixed heap address: mmap's base
      # with the default stack limit and with the unlimited one of the builds
      - name: machine
        run: |
          uname -a
          nproc
          free -g
          df -h / "$RUNNER_TEMP"
          cat /sys/fs/cgroup/memory.max 2> /dev/null || cat /sys/fs/cgroup/memory/memory.limit_in_bytes || true
          echo "vm.mmap_min_addr: $(cat /proc/sys/vm/mmap_min_addr)"
          grep -m 1 '^mmu' /proc/cpuinfo || true
          echo "stack limit: $(ulimit -s) soft, $(ulimit -Hs) hard"
          cat /proc/self/maps
          (ulimit -s unlimited && cat /proc/self/maps) || true

      - name: restore the binary cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/nix-cache
          key: riscv64-nix-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: riscv64-nix-

      - name: prepare the binary cache
        run: |
          cache=$RUNNER_TEMP/nix-cache
          mkdir -p "$cache/nar" "$cache/log" "$cache/realisations" "$cache/debuginfo"
          [ -f "$cache/nix-cache-info" ] ||
            printf 'StoreDir: /nix/store\nWantMassQuery: 1\nPriority: 10\n' > "$cache/nix-cache-info"
          echo "$(find "$cache" -name '*.narinfo' | wc -l) paths, $(du -sh "$cache" | cut -f1)"

      - name: install nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            max-jobs = 2
            cores = 2
            extra-substituters = file://${{ runner.temp }}/nix-cache?trusted=true
            log-lines = 100

      - name: nix settings
        run: |
          nix --version
          nix config show | grep -E '^(sandbox|sandbox-fallback|substituters|extra-substituters|trusted-users|max-jobs|cores|system) '

      - name: checkout nixpkgs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yzhou216/nixpkgs
          ref: ${{ env.REV }}
          path: nixpkgs
          persist-credentials: false

      - name: plan
        working-directory: nixpkgs
        run: |
          read -ra attrs <<< "$ATTRS"
          nix build --dry-run -f . "${attrs[@]}" 2> plan.txt || { cat plan.txt; exit 1; }
          grep 'will be' plan.txt

      # The gcc of nixpkgs's riscv64 bootstrap tools is a non-PIE executable
      # linked at 0x10000.  Unpacking it, patchelf grows its RPATH and maps the
      # moved headers one page lower, below this kernel's vm.mmap_min_addr of
      # 65536, so only root can run it (bootstrap-tools-probe.yml, run
      # 45090967386).  The stdenv, the only part that runs the bootstrap
      # tools, is therefore built as root outside the sandbox, at the lowest
      # priority, and everything after it as usual.
      - name: build the stdenv's xgcc
        working-directory: nixpkgs
        run: |
          bash -c "$RESLOG" & reslog=$!
          trap 'kill "$reslog"' EXIT
          sudo nice -n 19 env "PATH=$PATH" "NIX_SSL_CERT_FILE=$NIX_SSL_CERT_FILE" \
            nix-build -Q --no-out-link --keep-going -A "$STAGE2" \
            --option sandbox false --option max-jobs 1 --option cores 4 \
            --option extra-substituters "file://$RUNNER_TEMP/nix-cache?trusted=true"

      - name: return the store to the runner user (xgcc)
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" /nix

      - name: fill the binary cache (xgcc)
        run: nix copy --all --to "file://$RUNNER_TEMP/nix-cache?compression=zstd"

      - name: save the binary cache (xgcc)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/nix-cache
          key: riscv64-nix-${{ github.run_id }}-${{ github.run_attempt }}-xgcc

      - name: build the stdenv's glibc
        working-directory: nixpkgs
        run: |
          bash -c "$RESLOG" & reslog=$!
          trap 'kill "$reslog"' EXIT
          sudo nice -n 19 env "PATH=$PATH" "NIX_SSL_CERT_FILE=$NIX_SSL_CERT_FILE" \
            nix-build -Q --no-out-link --keep-going -A "$STAGE3" \
            --option sandbox false --option max-jobs 1 --option cores 4 \
            --option extra-substituters "file://$RUNNER_TEMP/nix-cache?trusted=true"

      - name: return the store to the runner user (glibc)
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" /nix

      - name: fill the binary cache (glibc)
        run: nix copy --all --to "file://$RUNNER_TEMP/nix-cache?compression=zstd"

      - name: save the binary cache (glibc)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/nix-cache
          key: riscv64-nix-${{ github.run_id }}-${{ github.run_attempt }}-glibc

      - name: build the stdenv's final gcc
        working-directory: nixpkgs
        run: |
          bash -c "$RESLOG" & reslog=$!
          trap 'kill "$reslog"' EXIT
          sudo nice -n 19 env "PATH=$PATH" "NIX_SSL_CERT_FILE=$NIX_SSL_CERT_FILE" \
            nix-build -Q --no-out-link --keep-going -A "$STAGE4" \
            --option sandbox false --option max-jobs 1 --option cores 4 \
            --option extra-substituters "file://$RUNNER_TEMP/nix-cache?trusted=true"

      - name: return the store to the runner user (gcc)
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" /nix

      - name: fill the binary cache (gcc)
        run: nix copy --all --to "file://$RUNNER_TEMP/nix-cache?compression=zstd"

      - name: save the binary cache (gcc)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/nix-cache
          key: riscv64-nix-${{ github.run_id }}-${{ github.run_attempt }}-gcc

      - name: build the stdenv
        working-directory: nixpkgs
        run: |
          bash -c "$RESLOG" & reslog=$!
          trap 'kill "$reslog"' EXIT
          sudo nice -n 19 env "PATH=$PATH" "NIX_SSL_CERT_FILE=$NIX_SSL_CERT_FILE" \
            nix-build -Q --no-out-link --keep-going -A stdenv \
            --option sandbox false --option max-jobs 1 --option cores 4 \
            --option extra-substituters "file://$RUNNER_TEMP/nix-cache?trusted=true"

      - name: return the store to the runner user (stdenv)
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" /nix

      - name: fill the binary cache (stdenv)
        run: nix copy --all --to "file://$RUNNER_TEMP/nix-cache?compression=zstd"

      - name: save the binary cache (stdenv)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/nix-cache
          key: riscv64-nix-${{ github.run_id }}-${{ github.run_attempt }}-stdenv

      # One step per milestone, since a running job's log cannot be read
      - name: build Hugs, MicroHs, and the 6.2.2 tree, runtime, happy and GMP
        working-directory: nixpkgs
        run: |
          bash -c "$RESLOG" & reslog=$!
          trap 'kill "$reslog"' EXIT
          nice -n 19 nix build --keep-going --no-link -f . hugs haskell.compiler.microhs \
            "$G.tree" "$G.rts" "$G.happy" "$G.gmp"

      - name: fill the binary cache (microhs)
        run: nix copy --all --to "file://$RUNNER_TEMP/nix-cache?compression=zstd"

      - name: save the binary cache (microhs)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/nix-cache
          key: riscv64-nix-${{ github.run_id }}-${{ github.run_attempt }}-microhs

      - name: build stage 1
        working-directory: nixpkgs
        run: |
          bash -c "$RESLOG" & reslog=$!
          trap 'kill "$reslog"' EXIT
          nice -n 19 nix build --keep-going --no-link -f . "$G.stage1"

      - name: fill the binary cache (stage 1)
        run: nix copy --all --to "file://$RUNNER_TEMP/nix-cache?compression=zstd"

      - name: save the binary cache (stage 1)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/nix-cache
          key: riscv64-nix-${{ github.run_id }}-${{ github.run_attempt }}-stage1

      - name: build stage 2
        working-directory: nixpkgs
        run: |
          bash -c "$RESLOG" & reslog=$!
          trap 'kill "$reslog"' EXIT
          nice -n 19 nix build --keep-going --no-link -f . "$G.base" "$G.stage2"

      - name: fill the binary cache (stage 2)
        run: nix copy --all --to "file://$RUNNER_TEMP/nix-cache?compression=zstd"

      - name: save the binary cache (stage 2)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/nix-cache
          key: riscv64-nix-${{ github.run_id }}-${{ github.run_attempt }}-stage2

      - name: build stages 3 to 5 and the fixpoint check
        working-directory: nixpkgs
        run: |
          bash -c "$RESLOG" & reslog=$!
          trap 'kill "$reslog"' EXIT
          nice -n 19 nix build --keep-going --no-link -f . "$G.tests.fixpoint"

      - name: fill the binary cache (stage3to5)
        run: nix copy --all --to "file://$RUNNER_TEMP/nix-cache?compression=zstd"

      - name: save the binary cache (stage3to5)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/nix-cache
          key: riscv64-nix-${{ github.run_id }}-${{ github.run_attempt }}-stage3to5

      - name: build the installed compiler and its test
        working-directory: nixpkgs
        run: |
          bash -c "$RESLOG" & reslog=$!
          trap 'kill "$reslog"' EXIT
          nice -n 19 nix build --keep-going --no-link -f . "$G" "$G.tests.hello"

      # The report without the stage 3 files, which all differ from stage 2's
      - name: fixpoint report
        working-directory: nixpkgs
        run: |
          out=$(nix build --no-link --print-out-paths -f . "$G.tests.fixpoint")
          awk '/^stage 3 vs stage 2/ { p = 1 } p || !/^differs: /' "$out/report.txt"

      - name: collect the build logs
        if: always()
        run: sudo tar -C /nix/var/log/nix -cf "$RUNNER_TEMP/logs.tar" drvs

      - name: upload the build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs
          path: ${{ runner.temp }}/logs.tar

      - name: fill the binary cache
        if: always()
        run: |
          nix copy --all --to "file://$RUNNER_TEMP/nix-cache?compression=zstd"
          echo "$(find "$RUNNER_TEMP/nix-cache" -name '*.narinfo' | wc -l) paths, $(du -sh "$RUNNER_TEMP/nix-cache" | cut -f1)"

      - name: save the binary cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/nix-cache
          key: riscv64-nix-${{ github.run_id }}-${{ github.run_attempt }}
