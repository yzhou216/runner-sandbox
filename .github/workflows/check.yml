# Checks the snapshot of cinq under cinq/ as cinq's own checks do, in its
# flake's dev shell: rustfmt, clippy with warnings denied, and the tests.
# Clippy's pedantic lints go to an artifact for review and never fail.
name: cinq checks
on: push
permissions:
  contents: read
defaults:
  run:
    shell: bash
    working-directory: cinq
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cinq
      - name: dev shell
        run: nix develop -c rustc --version
      - name: rustfmt
        run: nix develop -c cargo fmt --check
      - name: clippy
        run: nix develop -c cargo clippy --all-targets -- -D warnings
      - name: tests
        env:
          FONTCONFIG_FILE: /dev/null
        run: nix develop -c cargo test 2>&1 | tee ../tests.log
      - name: pedantic
        if: always()
        run: nix develop -c cargo clippy --all-targets -- -W clippy::pedantic 2> ../pedantic.txt || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            tests.log
            pedantic.txt
          if-no-files-found: ignore
