# Records cinq while keys edit the levels of cues that play, with the sound
# and a graph of its level, once for each commit named in live/refs.txt.  The
# tools of the session come from the nixpkgs of the commit that the first
# line, tools, names, so that every recording uses the same ones.
on: push
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  refs:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@main
      - id: matrix
        run: |
          # Lines are "name commit [swell]"; tools and comments are no recording
          matrix=$(awk '$1 !~ /^#/ && $1 != "tools" && NF >= 2 {
            printf "%s{\"name\":\"%s\",\"commit\":\"%s\",\"swell\":\"%s\"}", sep, $1, $2, ($3 == "" ? "-6.0" : $3)
            sep = ","
          }' live/refs.txt)
          echo "matrix={\"include\":[$matrix]}" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
  record:
    needs: refs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.refs.outputs.matrix) }}
    steps:
      - uses: actions/checkout@main
      # Commit before wimpysworld/nothing-but-nix#56, whose TMPDIR under /nix
      # makes the installer of Nix 2.35.4 fail with permission denied
      - uses: wimpysworld/nothing-but-nix@baf7355748bb5651f08b839669d6bb39051b2874
      - uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            extra-substituters = https://yzhou216.cachix.org
            extra-trusted-public-keys = yzhou216.cachix.org-1:O7nGwQnLGGBGE8zYFMipVzPVN956FcV57y9SqwEP+O8=
      - name: Build cinq of the commit and the tools of the session
        run: |
          nix build --out-link result-cinq "github:yzhou216/cinq/${{ matrix.commit }}"
          tools=$(awk '$1 == "tools" { print $2 }' live/refs.txt)
          nix build --out-link tools --inputs-from "github:yzhou216/cinq/$tools" \
            nixpkgs#sway-unwrapped nixpkgs#wtype nixpkgs#wf-recorder nixpkgs#grim \
            nixpkgs#pulseaudio nixpkgs#ffmpeg-headless nixpkgs#gawk
          nix build --out-link alsa-plugins --inputs-from "github:yzhou216/cinq/$tools" nixpkgs#alsa-plugins
          nix build --out-link fonts --inputs-from "github:yzhou216/cinq/$tools" nixpkgs#dejavu_fonts
          ls -d tools* result-cinq alsa-plugins fonts
      - name: Record cinq and compose the video
        env:
          SWELL: ${{ matrix.swell }}
        run: |
          mkdir -p logs
          PATH=$(for tool in tools*; do printf '%s/bin:' "$(readlink -f "$tool")"; done)$PATH
          export ALSA_PLUGIN_DIR FONTS
          ALSA_PLUGIN_DIR=$(readlink -f alsa-plugins)/lib/alsa-lib
          FONTS=$(readlink -f fonts)/share/fonts
          # Every command goes to the log, which the artifact keeps on failure
          bash -x live/run.sh result-cinq "${{ matrix.name }}" "out/${{ matrix.name }}" 2>&1 |
            tee "logs/${{ matrix.name }}.log"
      - if: always()
        uses: actions/upload-artifact@main
        with:
          name: ${{ matrix.name }}
          path: |
            out
            logs
          if-no-files-found: ignore
  side:
    needs: record
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@main
        with:
          path: parts
      - name: Put before and after side by side
        run: |
          tools=$(awk '$1 == "tools" { print $2 }' live/refs.txt)
          before=$(awk '$1 == "before" { print $2 }' live/refs.txt)
          after=$(awk '$1 == "after" { print $2 }' live/refs.txt)
          nix build --out-link ffmpeg --inputs-from "github:yzhou216/cinq/$tools" nixpkgs#ffmpeg-headless
          nix build --out-link fonts --inputs-from "github:yzhou216/cinq/$tools" nixpkgs#dejavu_fonts
          find parts -type f
          mkdir -p out
          PATH=$(for tool in ffmpeg*; do printf '%s/bin:' "$(readlink -f "$tool")"; done)$PATH bash -x live/side.sh \
            parts/before/out/before/before.mp4 parts/after/out/after/after.mp4 out/side-by-side.mp4 \
            "$(readlink -f fonts)/share/fonts/truetype/DejaVuSans.ttf" \
            "BEFORE: master ${before:0:8}" "AFTER: wip/live-edits ${after:0:8}"
      - uses: actions/upload-artifact@main
        with:
          name: side-by-side
          path: out
