# Records on GNU/Linux, Windows, and Darwin how cinq shows the problems of
# its config.toml on a screen of their own: cinq starts from a terminal,
# the script edits the file step by step, narrows the terminal while
# problems show, and ends cinq by its window and by Control+c
on: push
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  windows-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      # Commit before wimpysworld/nothing-but-nix#56, whose TMPDIR under /nix
      # makes the installer of Nix 2.35.4 fail with permission denied
      - uses: wimpysworld/nothing-but-nix@baf7355748bb5651f08b839669d6bb39051b2874
      - uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix build ./cinq#x86_64-windows-cross && cp result/bin/cinq.exe .
      - uses: actions/upload-artifact@main
        with:
          name: cinq-exe
          path: cinq.exe
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@main
      # Commit before wimpysworld/nothing-but-nix#56, as above
      - uses: wimpysworld/nothing-but-nix@baf7355748bb5651f08b839669d6bb39051b2874
      - uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build cinq and the tools that record it
        run: |
          nix build ./cinq
          nix build --inputs-from ./cinq --out-link fonts nixpkgs#dejavu_fonts
          nix build --inputs-from ./cinq --out-link tools nixpkgs#sway nixpkgs#foot \
            nixpkgs#vim nixpkgs#wtype nixpkgs#wf-recorder
      - name: Record
        run: |
          PATH=$(for tool in tools*; do printf '%s/bin:' "$(readlink -f "$tool")"; done)$PWD/result/bin:$PATH
          bash demo-linux.sh "$(readlink -f fonts)/share/fonts" videos
      - if: always()
        uses: actions/upload-artifact@main
        with:
          name: linux
          path: videos
          if-no-files-found: ignore
  windows:
    needs: windows-build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@main
      - uses: actions/download-artifact@main
        with:
          name: cinq-exe
      - shell: pwsh
        run: choco install ffmpeg -y --no-progress && ./demo.ps1
      - if: always()
        uses: actions/upload-artifact@main
        with:
          name: windows
          path: |
            demo.mkv
            captions.tsv
            ffmpeg.txt
          if-no-files-found: ignore
  darwin:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@main
      - uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix build ./cinq
      # Terminal's shell finds cinq on its own PATH
      - run: sudo mkdir -p /usr/local/bin && sudo ln -sf "$PWD/result/bin/cinq" /usr/local/bin/cinq
      - run: bash demo-darwin.sh videos
      - if: always()
        uses: actions/upload-artifact@main
        with:
          name: darwin
          path: videos
          if-no-files-found: ignore
