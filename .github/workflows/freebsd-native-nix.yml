# Builds cinq natively on x86_64 FreeBSD with Nix from FreeBSD's packages,
# against Nixpkgs master, which has the bootstrap files of
# NixOS/nixpkgs#585491, with the tzdata fix that is still only in staging.
# Nothing for native FreeBSD is in any cache, so everything builds from
# source; the build stops short of the six hours that a job may take, and
# out/ records how far it got and what failed.
#
# Nix 2.32 cannot sandbox builds on FreeBSD, so the bootstrap compiler found
# the VM's own FreeBSD 15.1 headers in /usr/include, which clash with those of
# Nixpkgs' FreeBSD 15.0 libc: m4, gettext, and nghttp2 failed to compile in run
# 42954331591.  The VM's headers and its libraries for linking are hidden here.
# Builders run as the build users that the port creates, since as root byacc's
# and libuv's tests failed, and FreeBSD's libxo and tinfo, built in an object
# directory under /obj that only root can create, failed to build (run
# 42957212013).
#
# Then LLVM's tests pull two test suites into FreeBSD's stdenv that fail on
# FreeBSD 15.1 (run 42957212013): Python's filelock, through psutil and
# pytest-xdist, where open with O_NOFOLLOW on a symbolic link fails with
# EMLINK, and libuv, through cmake, where poll_nested_kqueue fails with
# ENOTTY.  Both are skipped here, to tell how long the rest takes.
on:
  push:
    paths: [.github/workflows/freebsd-native-nix.yml, scripts/*.awk]
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  CINQ: 3de2258bb8fd33a3a4cefaff22cade29d3a9e450 # master on 2026-11-11
  NIXPKGS: fabeab7f4ccbf4e55ce28b3e59c7f7cc1f438eac # master on 2026-11-11
  TZDATA_FIX: e3e93a80b81f03e0ef4092a9b1b5051fdf970286
jobs:
  build:
    name: cinq built natively on x86_64-freebsd
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@main
      - name: Make room for the VM
        run: |
          df -h / /mnt
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo mkdir -p /mnt/vm && sudo chown "$USER" /mnt/vm
          df -h / /mnt
      - name: Fetch Nixpkgs and the tzdata fix
        run: |
          curl -fsSL -o nixpkgs.tar.gz "https://github.com/NixOS/nixpkgs/archive/$NIXPKGS.tar.gz"
          curl -fsSL -o tzdata.patch "https://github.com/NixOS/nixpkgs/commit/$TZDATA_FIX.patch"
          mkdir check
          tar -xzf nixpkgs.tar.gz -C check --strip-components 1
          patch -d check -p1 --dry-run < tzdata.patch
          rm -rf check
      - uses: vmactions/freebsd-vm@main
        with:
          mem: 13312
          data-dir: /mnt/vm
          envs: CINQ
          prepare: |
            pkg install -y nix git ca_root_nss
          run: |
            # The action stops at the first failure, which would lose out/
            set +e
            chown -R root:wheel "$GITHUB_WORKSPACE"
            freebsd-version
            sysctl -n hw.ncpu hw.physmem
            nix --version
            # Swap, so that a few large compilers at once slow down rather than die
            dd if=/dev/zero of=/usr/swap0 bs=1m count=4096 status=none
            chmod 0600 /usr/swap0
            mdconfig -a -t vnode -f /usr/swap0 -u 99
            swapon /dev/md99
            # Programs keep running, since they load the versioned libraries
            mv /usr/include /usr/include.hidden
            mkdir /usr/lib.hidden
            find /usr/lib -maxdepth 1 \( -name '*.so' -o -name '*.a' \) -exec mv {} /usr/lib.hidden \;
            /usr/local/share/nix/add-nixbld-users 8
            mkdir /root/nixpkgs
            tar -xzf nixpkgs.tar.gz -C /root/nixpkgs --strip-components 1
            cd /root/nixpkgs
            patch -s -p1 < "$GITHUB_WORKSPACE/tzdata.patch"
            sed -i '' 's/^  pyproject = true;$/&\
              doCheck = false;/' pkgs/development/python-modules/filelock/default.nix
            sed -i '' 's/^        "fs_event_watch_delete_dir"$/&\
                    "poll_nested_kqueue"/' pkgs/by-name/li/libuv/package.nix
            grep -n -e doCheck -e poll_nested_kqueue pkgs/development/python-modules/filelock/default.nix pkgs/by-name/li/libuv/package.nix
            cd "$GITHUB_WORKSPACE"
            NIX_CONFIG="experimental-features = nix-command flakes
            build-users-group = nixbld
            sandbox = false
            ssl-cert-file = /usr/local/share/certs/ca-root-nss.crt
            max-jobs = 3
            cores = 4
            keep-going = true
            log-lines = 80"
            export NIX_CONFIG
            mkdir -p out/logs
            flake="github:yzhou216/cinq/$CINQ#cinq"
            set -- --no-link --override-input nixpkgs path:/root/nixpkgs "$flake"
            nix build --dry-run "$@" > out/dry-run-before.txt 2>&1
            grep -E 'will be (built|fetched)' out/dry-run-before.txt
            start=$(date +%s)
            (
              while sleep 600; do
                echo "== $(( ($(date +%s) - start) / 60 )) min, $(grep -c "^building '" out/build.log) started, $(df -h / | tail -1)"
              done
            ) &
            ticker=$!
            # Short of the job's six hours, leaving time to record what was built
            {
              timeout 18900 nix build -v --log-format raw "$@" 2>&1
              echo "status $? after $(( ($(date +%s) - start) / 60 )) min" > out/status.txt
            } | tee out/build.log | awk -f scripts/errors.awk
            kill "$ticker"
            cat out/status.txt
            nix build --dry-run "$@" > out/dry-run-after.txt 2>&1
            grep -E 'will be (built|fetched)' out/dry-run-after.txt
            awk -f scripts/failed-builders.awk out/build.log | sort -u > out/failed-builders.txt
            echo "== $(wc -l < out/failed-builders.txt) builders failed"
            while read -r drv; do
              nix log "$drv" > "out/logs/${drv##*/}.log" 2>&1
            done < out/failed-builders.txt
            nix path-info --json --all > out/path-info.json
            du -sh /nix/store
            df -h /
            true
      - uses: actions/upload-artifact@main
        if: ${{ !cancelled() }}
        with:
          name: out
          path: out
