# Plays a video cue of cinq on GNU/Linux, Darwin, and Windows, then fades
# it out, with the main window and the stage side by side, and records the
# screen of each
on: push
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - uses: wimpysworld/nothing-but-nix@main
      - uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          mkdir show
          nix shell nixpkgs#ffmpeg -c ffmpeg -loglevel error -f lavfi -i testsrc2=size=1920x1080:rate=30 -f lavfi -i sine=frequency=440 -t 14 -c:v libx264 -profile:v high -pix_fmt yuv420p -c:a aac show/test.mp4
          cp video.cinq.toml show/
          mkdir small
          nix shell nixpkgs#ffmpeg -c ffmpeg -loglevel error -f lavfi -i testsrc2=size=640x360:rate=30 -f lavfi -i sine=frequency=440 -t 14 -c:v libx264 -profile:v high -pix_fmt yuv420p -c:a aac small/test.mp4
          cp video.cinq.toml small/
          nix build ./cinq#x86_64-windows-cross ./cinq#aarch64-windows-cross
          nix build --impure -f tests.nix x86_64 aarch64 --out-link tests
          mkdir x86_64 aarch64
          cp result/bin/cinq.exe tests/cinq-*.exe x86_64/
          cp result-1/bin/cinq.exe tests-1/cinq-*.exe aarch64/
          mv x86_64/cinq-*.exe x86_64/tests.exe
          mv aarch64/cinq-*.exe aarch64/tests.exe
      - uses: actions/upload-artifact@main
        with:
          name: show
          path: show
      - uses: actions/upload-artifact@main
        with:
          name: small
          path: small
      - uses: actions/upload-artifact@main
        with:
          name: x86_64
          path: x86_64
      - uses: actions/upload-artifact@main
        with:
          name: aarch64
          path: aarch64
  linux:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@main
      - uses: wimpysworld/nothing-but-nix@main
      - uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@main
        with:
          name: show
          path: show
      - run: nix build ./cinq && nix build --out-link tools nixpkgs#sway nixpkgs#wf-recorder nixpkgs#wtype nixpkgs#grim
      - run: |
          PATH=$(for tool in tools*; do printf '%s/bin:' "$(readlink -f "$tool")"; done)$PATH
          XDG_RUNTIME_DIR=$(mktemp -d)
          export XDG_RUNTIME_DIR WLR_BACKENDS=headless WLR_RENDERER=pixman WLR_LIBINPUT_NO_DEVICES=1
          printf 'output HEADLESS-1 resolution 1920x1080\n' > sway.config
          sway -c sway.config > sway.log 2>&1 &
          sleep 5
          WAYLAND_DISPLAY=$(find "$XDG_RUNTIME_DIR" -maxdepth 1 -name 'wayland-[0-9]' -printf '%f\n' | head -1)
          export WAYLAND_DISPLAY
          (cd show && timeout -k 5 60 ../result/bin/cinq video.cinq.toml > ../cinq.log 2>&1 &)
          sleep 6
          timeout -k 5 30 wf-recorder -D -f video.mp4 > recorder.log 2>&1 &
          sleep 2
          grim 1-opened.png
          wtype -s 300 -k space
          sleep 5
          grim 2-playing.png
          wtype -s 300 -k space
          sleep 1
          grim 3-fading.png
          sleep 4
          grim 4-faded.png
          pkill -INT wf-recorder
          sleep 3
          echo "--- cinq"
          cat cinq.log
      - if: always()
        uses: actions/upload-artifact@main
        with:
          name: linux
          path: |
            *.png
            video.mp4
          if-no-files-found: ignore
  darwin:
    needs: build
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@main
      - uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@main
        with:
          name: show
          path: show
      - run: nix build ./cinq
      - run: |
          open result/Applications/cinq.app --args "$PWD/show/video.cinq.toml"
          sleep 10
          # Main window and stage side by side, both in sight of the recording
          osascript -e 'tell application "System Events" to tell process "cinq"' \
            -e 'set position of window "video.cinq.toml - cinq" to {0, 30}' \
            -e 'set size of window "video.cinq.toml - cinq" to {560, 700}' \
            -e 'set position of window "video.cinq.toml stage - cinq" to {560, 30}' \
            -e 'set size of window "video.cinq.toml stage - cinq" to {464, 300}' \
            -e 'end tell' || echo "windows stay put"
          sleep 2
          screencapture -x 1-opened.png
          screencapture -x -V 16 video.mov &
          sleep 2
          osascript -e 'tell application "System Events" to keystroke " "'
          sleep 5
          screencapture -x 2-playing.png
          osascript -e 'tell application "System Events" to keystroke " "'
          sleep 1
          screencapture -x 3-fading.png
          sleep 4
          screencapture -x 4-faded.png
          wait
          pkill -x cinq
      - if: always()
        uses: actions/upload-artifact@main
        with:
          name: darwin
          path: |
            *.png
            video.mov
          if-no-files-found: ignore
  windows:
    needs: build
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, arch: x86_64, show: show }
          - { os: windows-latest, arch: x86_64, show: small }
          - { os: windows-11-arm, arch: aarch64, show: show }
          - { os: windows-11-arm, arch: aarch64, show: small }
    runs-on: ${{ matrix.os }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@main
      - uses: actions/download-artifact@main
        with:
          name: ${{ matrix.arch }}
      - uses: actions/download-artifact@main
        with:
          name: ${{ matrix.show }}
          path: show
      - run: ./tests.exe
        continue-on-error: true # Recording runs either way
      - run: choco install ffmpeg -y --no-progress > choco.log
      - shell: pwsh
        run: ./video.ps1
      - if: always()
        uses: actions/upload-artifact@main
        with:
          name: windows-${{ matrix.arch }}-${{ matrix.show }}
          path: |
            *.png
            video.mp4
            err.txt
          if-no-files-found: ignore
