# Builds cinq of the trees in before/, commit e278505 of the audio-outputs
# branch of yzhou216/cinq, whose sounds kira converts to the rate of the
# device by cubic interpolation, and after/, commit 6e43900, which converts
# them by windowed sinc interpolation, plays tones on JACK at 48 kHz with
# resample.sh, and prints how far below each tone the rest lies.
on: push
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  resampler:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@main
      # Commit before wimpysworld/nothing-but-nix#56, whose TMPDIR under /nix
      # makes the installer of Nix 2.35.4 fail with permission denied
      - uses: wimpysworld/nothing-but-nix@baf7355748bb5651f08b839669d6bb39051b2874
      - uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            extra-substituters = https://yzhou216.cachix.org
            extra-trusted-public-keys = yzhou216.cachix.org-1:O7nGwQnLGGBGE8zYFMipVzPVN956FcV57y9SqwEP+O8=
      - name: Build both trees of cinq and the tools of the session
        run: |
          nix build --out-link before-cinq ./before
          nix build --out-link after-cinq ./after
          nix build --out-link tools --inputs-from ./after nixpkgs#sway nixpkgs#wtype \
            nixpkgs#ffmpeg nixpkgs#jack2 nixpkgs#jack-example-tools nixpkgs#jack_capture
          nix build --out-link libjack --inputs-from ./after nixpkgs#libjack2
      - name: Play the tones on JACK
        run: |
          PATH=$(for tool in tools*; do printf '%s/bin:' "$(readlink -f "$tool")"; done)$PATH
          # Where cinq finds libjack, as it would in the system's libraries
          export LD_LIBRARY_PATH
          LD_LIBRARY_PATH=$(readlink -f libjack)/lib
          timeout -k 10 600 ./resample.sh out before-cinq after-cinq
      - name: Measure the rest below each tone
        if: always()
        run: |
          PATH=$(for tool in tools*; do printf '%s/bin:' "$(readlink -f "$tool")"; done)$PATH
          printf 'take\ttone dBFS\trest dBFS\n'
          for build in before-cinq after-cinq; do
            for tone in 44100-10000 44100-15000 48000-10000; do
              printf '%s\t%s\n' "$build-$tone" "$(./rest.sh "out/$build-$tone.wav" "${tone#*-}" || true)"
            done
          done | tee out/rest.tsv
      - if: always()
        uses: actions/upload-artifact@main
        with:
          name: resampler
          path: out
          if-no-files-found: ignore
