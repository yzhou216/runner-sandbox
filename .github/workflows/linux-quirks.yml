# Plays cinq of the tree in cinq/ on devices that stand in for the quirks
# of sound cards and JACK servers: with alsa.sh on the kernel's loopback
# card in a NixOS virtual machine, which vm.nix builds, since the
# kernels of the runners have no sound, and with jack.sh on jackd's dummy
# backend.  It prints the level of each channel and how clean the tone
# stayed in each take, with glitch.sh.
on: push
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  alsa:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@main
      # Commit before wimpysworld/nothing-but-nix#56, whose TMPDIR under /nix
      # makes the installer of Nix 2.35.4 fail with permission denied
      - uses: wimpysworld/nothing-but-nix@baf7355748bb5651f08b839669d6bb39051b2874
      - name: Let the build of Nix use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
            extra-substituters = https://yzhou216.cachix.org
            extra-trusted-public-keys = yzhou216.cachix.org-1:O7nGwQnLGGBGE8zYFMipVzPVN956FcV57y9SqwEP+O8=
      - name: Play on hw devices of ALSA in the virtual machine
        run: |
          nix build -L --impure --out-link result-alsa --expr "import ./vm.nix { workspace = \"$PWD\"; }" 2>&1 |
            tail -n 200
          mkdir -p out
          cp -r result-alsa/alsa out/
      - name: Measure each take
        if: always()
        run: |
          PATH=$(nix build --no-link --print-out-paths --inputs-from ./cinq nixpkgs#ffmpeg.bin)/bin:$PATH
          mkdir -p out
          printf 'take\tlevels of the channels\ttone\tlowest quarter\trest below the tone\n'
          for name in loop s16 s32 s24p float ch6 r44 r96 s24pplug ch6over; do
            file=out/alsa/$name.wav
            printf '%s\t%s\t%s\n' "$name" "$(./levels.sh "$file" 1 4.5 || true)" \
              "$(./glitch.sh "$file" 1 1000 1 4.5 || true)"
          done | tee out/alsa-takes.tsv
      - if: always()
        uses: actions/upload-artifact@main
        with:
          name: alsa
          path: out
          if-no-files-found: ignore
  realtime:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@main
      # Commit before wimpysworld/nothing-but-nix#56, whose TMPDIR under /nix
      # makes the installer of Nix 2.35.4 fail with permission denied
      - uses: wimpysworld/nothing-but-nix@baf7355748bb5651f08b839669d6bb39051b2874
      - name: Let the build of Nix use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
            extra-substituters = https://yzhou216.cachix.org
            extra-trusted-public-keys = yzhou216.cachix.org-1:O7nGwQnLGGBGE8zYFMipVzPVN956FcV57y9SqwEP+O8=
      - name: Play on busy processors with and without real-time scheduling
        run: |
          nix build -L --impure --out-link result-rt --expr "import ./vm-rt.nix { workspace = \"$PWD\"; }" 2>&1 |
            tail -n 100
          mkdir -p out
          cp -r result-rt/rt out/
      - name: Count the quarters that a glitch spoils
        if: always()
        run: |
          PATH=$(nix build --no-link --print-out-paths --inputs-from ./cinq nixpkgs#ffmpeg.bin)/bin:$PATH
          mkdir -p out
          notch=",bandreject=f=1000:width_type=h:w=300"
          for name in usual realtime; do
            echo "--- $name: threads of cinq"
            cat "out/rt/$name-threads.txt" || true
            printf '%s\t%s\t' "$name" "$(./glitch.sh "out/rt/$name.wav" 1 1000 1 9.5 || true)"
            ffmpeg -hide_banner -f wav -i "out/rt/$name.wav" \
              -af "pan=mono|c0=c0,aformat=sample_fmts=dbl$notch$notch$notch$notch,atrim=start=1:end=9.5,asetnsamples=n=12000,astats=metadata=1:reset=1,ametadata=mode=print:key=lavfi.astats.1.RMS_level:file=-" \
              -f null - 2> /dev/null | sed -n 's/^lavfi.astats.1.RMS_level=//p' |
              awk '$1 > -70 { spoiled++ } END { printf "%d of %d quarters spoiled\n", spoiled, NR }'
          done | tee out/realtime.tsv
      - if: always()
        uses: actions/upload-artifact@main
        with:
          name: realtime
          path: out
          if-no-files-found: ignore
  jack:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@main
      # Commit before wimpysworld/nothing-but-nix#56, whose TMPDIR under /nix
      # makes the installer of Nix 2.35.4 fail with permission denied
      - uses: wimpysworld/nothing-but-nix@baf7355748bb5651f08b839669d6bb39051b2874
      - uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            extra-substituters = https://yzhou216.cachix.org
            extra-trusted-public-keys = yzhou216.cachix.org-1:O7nGwQnLGGBGE8zYFMipVzPVN956FcV57y9SqwEP+O8=
      - name: Build cinq and the tools of the session
        run: |
          nix build --out-link result-cinq ./cinq
          nix build --out-link tools --inputs-from ./cinq nixpkgs#sway nixpkgs#wtype nixpkgs#grim \
            nixpkgs#ffmpeg nixpkgs#jack2 nixpkgs#jack-example-tools nixpkgs#jack_capture
          nix build --out-link libjack --inputs-from ./cinq nixpkgs#libjack2
      - name: Play on JACK servers of other rates, periods, and lifetimes
        run: |
          PATH=$(for tool in tools*; do printf '%s/bin:' "$(readlink -f "$tool")"; done)$PATH
          # Where cinq finds libjack, as it would in the system's libraries
          export LD_LIBRARY_PATH
          LD_LIBRARY_PATH=$(readlink -f libjack)/lib
          timeout -k 10 600 ./jack.sh result-cinq/bin/cinq out/jack
      - name: Measure each take
        if: always()
        run: |
          PATH=$(for tool in tools*; do printf '%s/bin:' "$(readlink -f "$tool")"; done)$PATH
          printf 'take\tlevels of the channels\ttone\tlowest quarter\trest below the tone\n'
          for name in rate-44100 rate-96000 period-64 period-4096 period-1000 ports-2 late restart; do
            file=out/jack/$name.wav
            printf '%s\t%s\t%s\n' "$name" "$(./levels.sh "$file" 0.5 3.5 || true)" \
              "$(./glitch.sh "$file" 1 1000 0.5 3.5 || true)"
          done | tee out/jack-takes.tsv
      - if: always()
        uses: actions/upload-artifact@main
        with:
          name: jack
          path: out
          if-no-files-found: ignore
