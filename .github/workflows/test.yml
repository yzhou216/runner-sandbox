name: macOS runtime test
on: [push, workflow_dispatch]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, arch: arm64 }
          - { runner: macos-latest, arch: arm64 }
          - { runner: macos-15-intel, arch: x86_64 }
    runs-on: ${{ matrix.runner }}
    env:
      BIN: /usr/local/bin/scrollreversed
    steps:
      - uses: actions/checkout@v4
      - name: Environment
        run: sw_vers; uname -m; csrutil status || true
      - name: Install
        run: |
          sudo install -d /usr/local/bin /usr/local/share/man/man1 /usr/local/share/man/man5
          sudo install -m 755 bin/scrollreversed-${{ matrix.arch }} "$BIN"
          sudo install -m 644 scrollreversed.1 /usr/local/share/man/man1/
          sudo install -m 644 scrollreversed.5 /usr/local/share/man/man5/
          codesign -dv "$BIN" 2>&1 | grep -E "Format|flags|not signed" || true
          swiftc -O probe.swift -o /tmp/probe
      - name: Command line and manual pages
        run: |
          "$BIN" --version
          MANPAGER=cat man scrollreversed | col -b | head -8
          MANPAGER=cat man 5 scrollreversed | col -b | head -8
          ! "$BIN" --device pen
          ! "$BIN" --config /nonexistent.toml
          printf 'devices = "mouse"\n' > /tmp/bad.toml
          ! "$BIN" --config /tmp/bad.toml
      - name: Agent waits without Accessibility access
        run: |
          mkdir -p ~/.config/scrollreversed
          printf 'verbose = true\n' > ~/.config/scrollreversed/config.toml
          cp io.yiyuzhou.scrollreversed.plist ~/Library/LaunchAgents/
          launchctl bootstrap gui/$(id -u) ~/Library/LaunchAgents/io.yiyuzhou.scrollreversed.plist
          sleep 5
          cat /tmp/scrollreversed.log
          grep -q "waiting for Accessibility access" /tmp/scrollreversed.log
          echo "--- scroll is untouched while waiting"
          /tmp/probe 1 1 1 1
      - name: Agent restarts by itself once access is granted
        run: |
          DB="/Library/Application Support/com.apple.TCC/TCC.db"
          sudo sqlite3 "$DB" "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version, flags) VALUES ('kTCCServiceAccessibility', '$BIN', 1, 2, 4, 1, 0);"
          for i in $(seq 1 15); do
            sleep 2
            grep -q "reversing mouse scrolling" /tmp/scrollreversed.log && break
          done
          cat /tmp/scrollreversed.log
          launchctl print gui/$(id -u)/io.yiyuzhou.scrollreversed | grep -E "runs|last exit"
          grep -q "reversing mouse scrolling" /tmp/scrollreversed.log
      - name: Default config reverses the wheel only
        run: |
          /tmp/probe -1 -1 1 1
          echo "--- daemon log"; tail -4 /tmp/scrollreversed.log
      - name: Config change after restart reverses all devices vertically
        run: |
          printf 'device = "all"\naxis = "vertical"\nverbose = true\n' > ~/.config/scrollreversed/config.toml
          launchctl kickstart -k gui/$(id -u)/io.yiyuzhou.scrollreversed
          sleep 3
          /tmp/probe -1 1 -1 1
          echo "--- daemon log"; tail -4 /tmp/scrollreversed.log
      - name: Command line overrides the config file
        run: |
          /usr/libexec/PlistBuddy -c "Add :ProgramArguments: string --device=trackpad" ~/Library/LaunchAgents/io.yiyuzhou.scrollreversed.plist
          launchctl bootout gui/$(id -u)/io.yiyuzhou.scrollreversed
          launchctl bootstrap gui/$(id -u) ~/Library/LaunchAgents/io.yiyuzhou.scrollreversed.plist
          sleep 3
          /tmp/probe 1 1 -1 1
          echo "--- daemon log"; tail -4 /tmp/scrollreversed.log
