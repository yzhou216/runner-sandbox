# Tells whether the picture of a video that falls behind on windows-11-arm
# comes of rust_h264 or of drawing there: plays video.cinq.toml by
# play.ps1 with cinq cross-built from the snapshot in cinq/, which decodes
# with rust_h264, and from cinq's master at 01c6d31, which decodes with
# openh264, each with iced's default renderer, which draws through WARP
# there, and with ICED_BACKEND=tiny-skia, twice each.  The run before this
# one, at 329a578, tested the rest.
on: push
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # Commit before wimpysworld/nothing-but-nix#56, whose TMPDIR under /nix
      # made the installer of Nix 2.35.4 fail with permission denied
      - uses: wimpysworld/nothing-but-nix@baf7355748bb5651f08b839669d6bb39051b2874
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Cross-build cinq for Windows on Arm, with rust_h264 and with openh264
        run: |
          nix build --out-link new ./cinq#aarch64-windows-cross
          nix build --out-link old github:yzhou216/cinq/01c6d31736d0162a44f20d3a90e27bfa46345882#aarch64-windows-cross
          mkdir rust_h264 openh264
          cp new/bin/cinq.exe rust_h264/
          cp old/bin/cinq.exe openh264/
      - name: Make the show
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          mkdir show
          cp video.cinq.toml show/
          bash media.sh show
      - uses: actions/upload-artifact@v7
        with:
          name: rust_h264
          path: rust_h264
      - uses: actions/upload-artifact@v7
        with:
          name: openh264
          path: openh264
      - uses: actions/upload-artifact@v7
        with:
          name: show
          path: show
  play:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        decoder: [rust_h264, openh264]
        backend: [default, tiny-skia]
        attempt: [1, 2]
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.decoder }}
      - uses: actions/download-artifact@v7
        with:
          name: show
          path: show
      - shell: pwsh
        run: |
          if ("${{ matrix.backend }}" -eq "tiny-skia") { $env:ICED_BACKEND = "tiny-skia" }
          ./play.ps1
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-arm-${{ matrix.decoder }}-${{ matrix.backend }}-${{ matrix.attempt }}
          path: out
          if-no-files-found: ignore
