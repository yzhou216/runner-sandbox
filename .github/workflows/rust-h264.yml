# Tells whether the picture of a video that falls behind on a RISE RISC-V
# runner comes of rust_h264 or of drawing there: plays video.cinq.toml by
# play.sh with cinq built from the snapshot in cinq/, which decodes with
# rust_h264, and from cinq's master at 01c6d31, which decodes with openh264,
# whose build script yzhou216/openh264-rs's branch riscv64 teaches riscv64,
# each with iced's default renderer and with ICED_BACKEND=tiny-skia.  Run
# 42337020892, at 329a578, tested the rest and made the show.
on: push
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
jobs:
  riscv64:
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - name: Install what builds cinq and plays the show
        run: |
          sudo apt-get update
          # The image holds liboss4-salsa-asound2, the ALSA library of OSS 4,
          # in place of ALSA's own, which libasound2-dev needs
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev scdoc \
            liboss4-salsa-asound2- sway grim wtype fonts-dejavu-core pulseaudio \
            pulseaudio-utils libasound2-plugins ffmpeg
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            cinq/target/
          key: cargo-riscv64-rust-h264-${{ hashFiles('cinq/Cargo.lock') }}
      - name: Build cinq with rust_h264
        working-directory: cinq
        run: |
          cargo build --release --locked
          cp target/release/cinq ../cinq-rust_h264
      - name: Build cinq's master with openh264
        run: |
          git clone -q https://github.com/yzhou216/cinq master
          git -C master checkout -q 01c6d31736d0162a44f20d3a90e27bfa46345882
          cd master
          # Dependencies that the two builds share build once, in one place
          start=$SECONDS
          CARGO_TARGET_DIR=../cinq/target cargo build --release \
            --config 'patch.crates-io.openh264-sys2.git="https://github.com/yzhou216/openh264-rs"' \
            --config 'patch.crates-io.openh264-sys2.branch="riscv64"'
          echo "built in $((SECONDS - start)) seconds"
          cp ../cinq/target/release/cinq ../cinq-openh264
      - uses: actions/download-artifact@v7
        with:
          name: show
          path: show
          run-id: 42337020892
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Play the show with each build and each renderer
        run: |
          for build in rust_h264 openh264; do
            bash play.sh "cinq-$build" show "out-$build-default"
            ICED_BACKEND=tiny-skia bash play.sh "cinq-$build" show "out-$build-tiny-skia"
          done
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: riscv64-ab
          path: out-*
          if-no-files-found: ignore
