# Runs the bcachefs test of disko with the change in
# disko-bcachefs/disko.patch, and once more with its fix left out, to
# show that the extended test catches the bug.
name: disko bcachefs
on:
  push:
    paths:
      - disko-bcachefs/**
      - .github/workflows/disko-bcachefs.yml
defaults:
  run:
    shell: bash
env:
  DISKO_BASE: 44761d4f745b95e037458a0e57133c5700c8e320
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # Twice with the fix, since the unlock units of NixOS race at boot
        include:
          - fix: with
            attempt: 1
          - fix: with
            attempt: 2
          - fix: without
            attempt: 1
    name: bcachefs test, ${{ matrix.fix }} the fix, ${{ matrix.attempt }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@main
      - uses: wimpysworld/nothing-but-nix@main
        with:
          hatchet-protocol: rampage
      - name: Let QEMU use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
      - name: Check out disko with the change
        env:
          FIX: ${{ matrix.fix }}
        run: |
          git clone --quiet https://github.com/nix-community/disko "$RUNNER_TEMP/disko"
          cd "$RUNNER_TEMP/disko"
          git checkout --quiet "$DISKO_BASE"
          git apply "$GITHUB_WORKSPACE/disko-bcachefs/disko.patch"
          if [ "$FIX" = without ]; then
            git checkout -- lib/types/bcachefs_filesystem.nix
          fi
          git diff --stat
      - name: Run the bcachefs test
        working-directory: ${{ runner.temp }}/disko
        run: nix build -L --no-link .#checks.x86_64-linux.bcachefs
