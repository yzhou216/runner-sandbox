# Builds cinq of the trees in before/, commit e278505 of the audio-outputs
# branch of yzhou216/cinq, and after/, commit 6e43900 of its
# resampler-prototype branch, and plays sixteen looping cues on 64
# channels of JACK for five minutes with each, with soak.sh, which prints
# the share of a processor that each took and the xruns of jackd.
on: push
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@main
      # Commit before wimpysworld/nothing-but-nix#56, whose TMPDIR under /nix
      # makes the installer of Nix 2.35.4 fail with permission denied
      - uses: wimpysworld/nothing-but-nix@baf7355748bb5651f08b839669d6bb39051b2874
      - uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            extra-substituters = https://yzhou216.cachix.org
            extra-trusted-public-keys = yzhou216.cachix.org-1:O7nGwQnLGGBGE8zYFMipVzPVN956FcV57y9SqwEP+O8=
      - name: Build both trees of cinq and the tools of the session
        run: |
          nix build --out-link before-cinq ./before
          nix build --out-link after-cinq ./after
          nix build --out-link tools --inputs-from ./after nixpkgs#sway nixpkgs#wtype nixpkgs#grim \
            nixpkgs#ffmpeg nixpkgs#jack2 nixpkgs#jack-example-tools nixpkgs#jack_capture
          nix build --out-link libjack --inputs-from ./after nixpkgs#libjack2
          nproc
      - name: Play sixteen loops on 64 channels
        run: |
          PATH=$(for tool in tools*; do printf '%s/bin:' "$(readlink -f "$tool")"; done)$PATH
          # Where cinq finds libjack, as it would in the system's libraries
          export LD_LIBRARY_PATH
          LD_LIBRARY_PATH=$(readlink -f libjack)/lib
          timeout -k 10 1200 ./soak.sh out 300 before-cinq after-cinq | tee out-summary.tsv
      - name: Measure each port at the end
        if: always()
        run: |
          PATH=$(for tool in tools*; do printf '%s/bin:' "$(readlink -f "$tool")"; done)$PATH
          cp out-summary.tsv out/ || true
          for build in before-cinq after-cinq; do
            echo "--- $build: level of each port"
            ./levels.sh "out/$build.wav" 0.5 | tee "out/levels-$build.tsv" || true
          done
      - if: always()
        uses: actions/upload-artifact@main
        with:
          name: soak
          path: out
          if-no-files-found: ignore
