# Runs ETC's Eos software, the software of the Ion Xe console, offline on
# Windows, and drives it over OSC while listen.py records the sACN and
# Art-Net that it sends.  Each phase uploads what it found, since a runner
# that loses its connection uploads nothing more.
name: Eos offline
on: push
permissions:
  actions: read
  contents: read
defaults:
  run:
    shell: bash
jobs:
  windows:
    needs: cinq-windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Download Eos
        run: |
          curl -sSfL -o eos.zip https://cdn.etcconnect.com/ETC_EosFamily_v3.3.10.28.zip
          7z x eos.zip
          # shellcheck disable=SC2016 # $PLUGINSDIR is a directory in the archive
          7z x -oeos-parts ETC_EosFamily_v3.3.10.28.exe '$PLUGINSDIR/ETC_EosFamily_v3.3.10.28.msi' \
            '$PLUGINSDIR/VC_redist.x64.exe' '$PLUGINSDIR/VC_redist.x86.exe' '$PLUGINSDIR/vcredist_2005_sp1_vc8_x86.exe'
      - name: Install
        timeout-minutes: 20
        run: powershell -NoProfile -ExecutionPolicy Bypass -File eos/install.ps1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install
          path: out
      - name: Start
        timeout-minutes: 15
        run: powershell -NoProfile -ExecutionPolicy Bypass -File eos/start.ps1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: start
          path: out
      - name: Program Eos over OSC
        timeout-minutes: 5
        run: powershell -NoProfile -ExecutionPolicy Bypass -File eos/program.ps1 steps-3.txt
      - uses: actions/download-artifact@v4
        with:
          name: cinq-windows
          path: cinq-windows
      - name: cinq fires Eos cues with network cues
        timeout-minutes: 8
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File eos/beside.ps1 network.toml 6
          sleep 10
          powershell -NoProfile -ExecutionPolicy Bypass -File eos/snap.ps1 fired
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fired
          path: out
      - name: Eos goes down and comes back while cinq runs
        timeout-minutes: 20
        run: |
          shell() { powershell -NoProfile -ExecutionPolicy Bypass "$@"; }
          shell -Command 'Stop-Process -Name cinq -Force -ErrorAction SilentlyContinue'
          shell -File eos/beside.ps1 restart.toml 1
          shell -Command 'Stop-Process -Name Eos, ETC_LaunchOffline -Force'
          sleep 5
          shell -File eos/go.ps1 down 1
          shell -File eos/snap.ps1 down
          shell -File eos/start.ps1 -Again
          shell -File eos/program.ps1 steps-3.txt
          shell -File eos/go.ps1 back 1
          shell -File eos/snap.ps1 back
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restart
          path: out
      - name: ion-test.toml, the show for the Ion Xe, sent to Eos on this computer
        timeout-minutes: 8
        run: |
          shell() { powershell -NoProfile -ExecutionPolicy Bypass "$@"; }
          sed 's/10\.101\.100\.20/127.0.0.1/' ion-xe/ion-test.toml > eos/ion-local.toml
          shell -Command 'Stop-Process -Name cinq -Force -ErrorAction SilentlyContinue'
          shell -File eos/beside.ps1 ion-local.toml 5
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ion-test
          path: out
  # cinq with sACN and network cues, from a snapshot of commits not yet
  # pushed
  cinq-windows:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # Commit before wimpysworld/nothing-but-nix#56, whose TMPDIR under /nix
      # makes the installer of Nix 2.35.4 fail with permission denied
      - uses: wimpysworld/nothing-but-nix@baf7355748bb5651f08b839669d6bb39051b2874
      - uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          nix build ./cinq#x86_64-windows
          mkdir cinq-windows && cp -rL result/. cinq-windows/ && find cinq-windows
      - uses: actions/upload-artifact@v4
        with:
          name: cinq-windows
          path: cinq-windows
  cinq-darwin:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: wimpysworld/nothing-but-nix@baf7355748bb5651f08b839669d6bb39051b2874
      - uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          nix build ./cinq#aarch64-darwin
          find -L result | head -40
          tar -chf cinq-darwin.tar -C result .
      - uses: actions/upload-artifact@v4
        with:
          name: cinq-darwin
          path: cinq-darwin.tar
  # sACN and Art-Net of cinq on Darwin, where multicast picks its network
  # otherwise than on GNU/Linux and Windows
  darwin:
    needs: cinq-darwin
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cinq-darwin
      - run: |
          mkdir cinq-darwin && tar -xf cinq-darwin.tar -C cinq-darwin
          bash eos/darwin.sh "$PWD/cinq-darwin/Applications/cinq.app" out
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: darwin
          path: out
  # Signature of cinq.app as Nix builds it on Darwin itself, where the
  # fixup of Nixpkgs runs before the bundle is signed
  darwin-native:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          nix build ./cinq
          mkdir out
          codesign -dv --verbose=4 result/Applications/cinq.app > out/codesign-native.txt 2>&1
          codesign --verify --deep --strict --verbose=2 result/Applications/cinq.app >> out/codesign-native.txt 2>&1
          cat out/codesign-native.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: darwin-native
          path: out
  # cinq on GNU/Linux: sACN and Art-Net on the runner's own networks,
  # network cues to fakeeos.py over TCP and UDP, and the show for the Ion Xe
  # over a cable that comes out
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: wimpysworld/nothing-but-nix@baf7355748bb5651f08b839669d6bb39051b2874
      - uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build cinq and the session's tools
        run: |
          nix build ./cinq
          nix build --inputs-from ./cinq --out-link fonts nixpkgs#dejavu_fonts
          nix build --inputs-from ./cinq --out-link tools nixpkgs#sway nixpkgs#wtype nixpkgs#grim nixpkgs#python3
      - name: Run
        run: |
          PATH=$(for tool in tools*; do printf '%s/bin:' "$(readlink -f "$tool")"; done)$PWD/result/bin:$PATH
          bash eos/linux.sh "$(readlink -f fonts)/share/fonts" out
          bash eos/stress.sh "$(readlink -f fonts)/share/fonts" out/stress
      - name: ion-test.toml beside a stand-in Ion Xe, with its cable out and back
        run: |
          PATH=$(for tool in tools*; do printf '%s/bin:' "$(readlink -f "$tool")"; done)$PWD/result/bin:$PATH
          bash eos/lan.sh "$(readlink -f fonts)/share/fonts" out/lan
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out
  # A console that loses its power under cinq: the first GO after it comes
  # back has to arrive (5501a62 lost it without a word; run 43598804720)
  powercut:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: wimpysworld/nothing-but-nix@baf7355748bb5651f08b839669d6bb39051b2874
      - uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build cinq and the session's tools
        run: |
          nix build --out-link new ./cinq
          nix build --inputs-from ./cinq --out-link fonts nixpkgs#dejavu_fonts
          nix build --inputs-from ./cinq --out-link tools nixpkgs#sway nixpkgs#wtype nixpkgs#grim nixpkgs#python3
      - name: Cut the power of a console under each
        run: |
          PATH=$(for tool in tools*; do printf '%s/bin:' "$(readlink -f "$tool")"; done)$PATH
          bash eos/powercut.sh new/bin/cinq "$(readlink -f fonts)/share/fonts" out
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: powercut
          path: out
