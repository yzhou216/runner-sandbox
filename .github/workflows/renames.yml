# Folds the renames of rebuild/rename.py into every commit of master and
# c2y of yzhou216/rv64_emu with rebuild/rewrite.py, checks that the result
# is the history that the laptop built, and with rebuild/same-code.sh
# that every rewritten commit compiles to the same code and data as its
# original.  The laptop pushes the commits, since nothing here can write
# to rv64_emu.
on: push
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  EXPECTED_MASTER: 6d758ff711e9eb4089e5c3ea4877e452c5d6e3d3
  EXPECTED_C2Y: 5d83c6211b5ef9a5feb9202445a1a15e2a0a0f08
jobs:
  renames:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: wimpysworld/nothing-but-nix@v12
      - uses: cachix/install-nix-action@v31
      - uses: actions/checkout@v7
      - name: Clone rv64_emu
        run: |
          git clone https://github.com/yzhou216/rv64_emu "$RUNNER_TEMP/rs"
          git -C "$RUNNER_TEMP/rs" rev-parse origin/master origin/c2y
      - name: Rewrite the history
        run: |
          mkdir -p out
          REPO="$RUNNER_TEMP/rs" python3 -I rebuild/rewrite.py | tee out/rewrite.log
          test "$(git -C "$RUNNER_TEMP/rs" rev-parse refs/rewrite/master)" = "$EXPECTED_MASTER"
          test "$(git -C "$RUNNER_TEMP/rs" rev-parse refs/rewrite/c2y)" = "$EXPECTED_C2Y"
          echo "Both branches match the history that the laptop built"
      - name: Compare the code of every commit
        run: |
          flake="git+file://$RUNNER_TEMP/rs?rev=$EXPECTED_MASTER"
          nix develop "$flake" -c env REPO="$RUNNER_TEMP/rs" rebuild/same-code.sh out/same-code.log
          cat out/same-code.log
      - name: Show the log
        if: ${{ failure() }}
        run: cat out/same-code.log
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: renames
          path: out/
