# Measures whether cinq's video plays in real time with rust_h264's threaded
# decoder.  Each runner plays two clips, 1080p at 60 pictures a second and
# 2160p at 30, through the video output of cinq's master at 798c620 (`base`)
# and, when the directories cinq/ and rust_h264/ exist, of the tree in
# (cloned and patched by a step from patches/)
# cinq/ built against the rust_h264 in rust_h264/ (`threaded`), by
# realtime/run.sh.  It runs the tests of both directories too.
on: push
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  clips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: mkdir clips && bash bench/clips.sh clips
      - uses: actions/upload-artifact@v7
        with:
          name: clips
          path: clips
  cinq:
    needs: clips
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      CINQ_SHARE_DIR: '' # No manual pages, which need scdoc
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: clips
          path: clips
      - name: Fetch rust_h264 and cinq with the patches
        run: |
          ident=(-c user.name=sandbox -c user.email=sandbox@example.com)
          git clone -q https://github.com/roticv/rust_h264 rust_h264
          git -C rust_h264 checkout -q 6436335
          git -C rust_h264 "${ident[@]}" am "$PWD"/patches/rust_h264/*.patch
          git clone -q https://github.com/yzhou216/cinq cinq
          git -C cinq checkout -q 798c620
          git -C cinq "${ident[@]}" am "$PWD"/patches/cinq/*.patch
          rm -rf rust_h264/.git cinq/.git
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config
      - name: Test rust_h264
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target-tests # Outside the trees that run.sh copies
        if: hashFiles('rust_h264/Cargo.toml') != ''
        working-directory: rust_h264
        run: cargo test --release 2>&1 | tee ../test-rust_h264.log
      - name: Test cinq
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target-tests
        if: hashFiles('cinq/Cargo.toml') != '' && !cancelled()
        working-directory: cinq
        run: cargo test --release 2>&1 | tee ../test-cinq.log
      - name: Play the clips in real time
        if: '!cancelled()'
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target-shared # Dependencies built once for every tree
        run: |
          {
            echo "# ${{ matrix.os }}"
            echo
            bash realtime/run.sh clips
          } 2>&1 | tee "realtime-${{ matrix.os }}.txt"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cinq-${{ matrix.os }}
          path: |
            test-*.log
            realtime-*.txt
          if-no-files-found: ignore
