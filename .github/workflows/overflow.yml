# Runs fib_rec 40, which executes 3146022663 instructions, more than an int
# holds, on yzhou216/rv64_emu under qemu-riscv64 with the instruction mix and
# a set-associative cache, before and after its counters became 64 bits.
on: push
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  run:
    name: fib_rec 40 on ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: int counters
            rev: 104c8abc5c69b72b0ccdee05834e6d1ca0623d1e
          - name: 64-bit counters
            rev: de32944b9770e149b64541e7b183c17ae86a32c7
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      REV: ${{ matrix.rev }}
    steps:
      - uses: cachix/install-nix-action@v31
      - name: Build rv64_emu
        run: |
          git clone -q https://github.com/yzhou216/rv64_emu "$RUNNER_TEMP/emu"
          git -C "$RUNNER_TEMP/emu" checkout -q --detach "$REV"
          git -C "$RUNNER_TEMP/emu" log -1 --format='%H %s'
          nix build "$RUNNER_TEMP/emu" --out-link "$RUNNER_TEMP/result"
      - name: Run fib_rec 40
        run: |
          time nix shell --inputs-from "$RUNNER_TEMP/emu" nixpkgs#qemu-user -c \
            qemu-riscv64 "$RUNNER_TEMP/result/bin/rv64_emu" -a -sa 64 4 2 fib_rec 40
