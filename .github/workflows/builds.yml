# Tries the jobs that cinq's build.yml gains for riscv64 GNU/Linux and
# FreeBSD, natively and cross-built on x86_64 GNU/Linux, and its cross and
# packages jobs as they are split there, on the snapshot of cinq in cinq/
on: push
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  riscv64-linux:
    name: cinq built on riscv64-linux
    runs-on: ubuntu-24.04-riscv
    steps:
      - uses: actions/checkout@main
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev scdoc liboss4-salsa-asound2-
      - uses: actions/cache@main
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            cinq/target/
          key: cargo-riscv64-linux-${{ hashFiles('cinq/Cargo.lock') }}
      - working-directory: cinq
        run: |
          start=$SECONDS
          cargo test --release --locked
          echo "tested in $((SECONDS - start)) seconds"
      - working-directory: cinq
        run: |
          start=$SECONDS
          cargo build --release --locked
          echo "built in $((SECONDS - start)) seconds"
          mkdir -p cinq/bin
          cp target/release/cinq cinq/bin
          cp -r target/share cinq
          tar -cf ../cinq-riscv64-linux.tar -C cinq .
      - uses: actions/upload-artifact@main
        with:
          path: cinq-riscv64-linux.tar
          archive: false
  x86_64-freebsd:
    name: cinq built on x86_64-freebsd
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - uses: vmactions/freebsd-vm@main
        with:
          mem: 12288
          prepare: pkg install -y rust scdoc pkgconf alsa-lib
          run: |
            cd cinq
            freebsd-version
            cargo --version
            export CARGO_TARGET_DIR=/var/tmp/target
            start=$(date +%s)
            cargo test --release --locked
            echo "tested in $(($(date +%s) - start)) seconds"
            cargo build --release --locked
            echo "tested and built in $(($(date +%s) - start)) seconds"
            mkdir -p cinq/bin
            cp "$CARGO_TARGET_DIR/release/cinq" cinq/bin
            cp -R target/share cinq
            tar -cf ../cinq-x86_64-freebsd.tar -C cinq .
      - run: tar -tvf cinq-x86_64-freebsd.tar | head -20
      - uses: actions/upload-artifact@main
        with:
          path: cinq-x86_64-freebsd.tar
          archive: false
  cross:
    name: cinq for ${{ matrix.host }} built on ${{ matrix.system }}
    strategy:
      fail-fast: false
      matrix:
        system: [x86_64-linux]
        host: [aarch64-darwin, x86_64-windows, aarch64-windows, riscv64-linux, x86_64-freebsd]
        include:
          - system: x86_64-linux
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@main
      - uses: wimpysworld/nothing-but-nix@main
      - uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          nix build ./cinq#${{ matrix.host }}
          name=cinq-${{ matrix.host }}-built-on-${{ matrix.system }}
          if [ -e result/bin/cinq.exe ]; then
            cp result/bin/cinq.exe "$name.exe"
            echo "artifact=$name.exe" >> "$GITHUB_ENV"
          else
            tar -cf "$name.tar" -C result .
            echo "artifact=$name.tar" >> "$GITHUB_ENV"
          fi
          file -L result/bin/* || true
      - if: matrix.host == 'riscv64-linux' || matrix.host == 'x86_64-freebsd'
        run: | # Closure that the run jobs below lay out in their /nix/store
          readlink -f result > path.txt
          nix-store -qR result | tar -cf closure.tar -T -
          ls -l closure.tar
      - uses: actions/upload-artifact@main
        with:
          path: ${{ env.artifact }}
          archive: false
      - if: matrix.host == 'riscv64-linux' || matrix.host == 'x86_64-freebsd'
        uses: actions/upload-artifact@main
        with:
          name: closure-${{ matrix.host }}
          path: |
            path.txt
            closure.tar
  run-riscv64-linux:
    name: cinq for riscv64-linux built on x86_64-linux, run on riscv64-linux
    needs: cross
    runs-on: ubuntu-24.04-riscv
    steps:
      - uses: actions/download-artifact@main
        with:
          name: closure-riscv64-linux
      - run: |
          sudo tar -xf closure.tar -C /
          cinq=$(cat path.txt)/bin/cinq
          file "$cinq" || true
          "$cinq" --version
          "$cinq" --help | head -5
  run-x86_64-freebsd:
    name: cinq for x86_64-freebsd built on x86_64-linux, run on x86_64-freebsd
    needs: cross
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@main
        with:
          name: closure-x86_64-freebsd
      - uses: vmactions/freebsd-vm@main
        with:
          copyback: false
          run: |
            freebsd-version
            tar -xf closure.tar -C /
            cinq=$(cat path.txt)/bin/cinq
            file "$cinq"
            "$cinq" --version
            "$cinq" --help | head -5
  packages:
    name: packages built on ${{ matrix.system }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            system: x86_64-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@main
      - uses: wimpysworld/nothing-but-nix@main
      - uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          nix build ./cinq#deb ./cinq#rpm ./cinq#archlinux
          cp result*/* .
          ls -l cinq_*.deb cinq-*.rpm cinq-*.pkg.tar.zst
      - uses: actions/upload-artifact@main
        with:
          name: cinq-${{ matrix.system }}-packages
          path: |
            cinq_*.deb
            cinq-*.rpm
            cinq-*.pkg.tar.zst
