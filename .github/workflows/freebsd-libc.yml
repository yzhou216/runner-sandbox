# Tells why FreeBSD's libthr that Nixpkgs builds for x86_64-freebsd on
# aarch64-linux exports 7 symbols where the one built on x86_64-linux
# exports 312, as run 42425472510 showed.  Both ran the same cpp and awk to
# write Version.map, so this prints the map and the tools that wrote it.
on:
  push:
    paths: [.github/workflows/freebsd-libc.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  libthr:
    name: libthr for x86_64-freebsd built on ${{ matrix.system }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {system: x86_64-linux, os: ubuntu-latest}
          - {system: aarch64-linux, os: ubuntu-24.04-arm}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@main
      - uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          nix build --no-link -L --impure --expr "import ./scripts/libthr-map.nix { flake = \"git+file://$PWD?dir=cinq\"; system = \"${{ matrix.system }}\"; }" 2>&1 \
            | sed -n '/> Running phase: buildPhase/,/> Running phase: installPhase/p' | grep -a -v -E '> (---|x86_64-unknown-freebsd-(clang|ar|ranlib|objcopy)) ' | tail -120
