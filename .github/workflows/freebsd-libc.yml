# Tells why FreeBSD's libthr that Nixpkgs builds for x86_64-freebsd on
# aarch64-linux lacks pthread_create, as run 42424765022 showed, while the
# one built on x86_64-linux has it.  Run 42425333973 found the broken one
# in cache.nixos.org, without a log, so this builds libthr again on each
# system for the logs and the symbols of each.
on:
  push:
    paths: [.github/workflows/freebsd-libc.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  libthr:
    name: libthr for x86_64-freebsd built on ${{ matrix.system }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {system: x86_64-linux, os: ubuntu-latest}
          - {system: aarch64-linux, os: ubuntu-24.04-arm}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@main
      - uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          drv=$(nix eval --raw --impure --expr "(builtins.getFlake \"git+file://$PWD?dir=cinq\").inputs.nixpkgs.legacyPackages.${{ matrix.system }}.pkgsCross.x86_64-freebsd.freebsd.libthr.drvPath")
          echo "$drv"
          nix build --no-link "$drv^*"
          nix build --no-link --rebuild -L "$drv^*" > rebuild.log 2>&1 || echo "the rebuild differs from the cache or failed"
          tail -3 rebuild.log
          nix log "$drv" > libthr.log
          wc -l libthr.log
          out=$(nix build --no-link --print-out-paths "$drv^out")
          nix shell nixpkgs#llvmPackages.bintools -c llvm-nm -D --defined-only "$out/lib/libthr.so.3" | awk '{print $3}' | sort > libthr.syms
          wc -l libthr.syms
          grep -c pthread_create libthr.syms || true
      - uses: actions/upload-artifact@main
        with:
          name: libthr-${{ matrix.system }}
          path: |
            libthr.log
            libthr.syms
            rebuild.log
