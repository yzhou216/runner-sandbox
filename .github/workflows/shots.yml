# Takes the screenshots of cinq's tutorial with shots.sh: cinq of the
# commit below plays storm.cinq.toml in a headless sway session with two
# 4:3 outputs, one for the main window and one for the stage window, each
# without a border
on: push
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  CINQ: github:yzhou216/cinq/6f5bc2e2ba00225195e872e766678b294655d361
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@main
      # Commit before wimpysworld/nothing-but-nix#56, whose TMPDIR under /nix
      # makes the installer of Nix 2.35.4 fail with permission denied
      - uses: wimpysworld/nothing-but-nix@baf7355748bb5651f08b839669d6bb39051b2874
      - uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build cinq and the tools of the session
        run: |
          nix build --out-link cinq "$CINQ"
          nix build --out-link tools --inputs-from "$CINQ" nixpkgs#sway nixpkgs#wtype \
            nixpkgs#grim nixpkgs#ffmpeg nixpkgs#pulseaudio nixpkgs#oxipng
          nix build --out-link alsa-plugins --inputs-from "$CINQ" nixpkgs#alsa-plugins
          nix build --out-link fonts --inputs-from "$CINQ" nixpkgs#dejavu_fonts
      - name: Make the sounds, the picture, and the film of the show
        run: |
          mkdir show
          cp storm.cinq.toml show/
          PATH=$(readlink -f tools-3-bin)/bin:$PATH bash media.sh show \
            "$(readlink -f fonts)/share/fonts/truetype/DejaVuSans.ttf"
      # Home of the session at the path that the help page shows, named as
      # the examples of cinq(5) name the user
      - name: Take the screenshots
        run: |
          sudo install -d -o "$(id -u)" -g "$(id -g)" /home/alice
          PATH=$(for tool in tools*; do printf '%s/bin:' "$(readlink -f "$tool")"; done)$PATH
          export SHOTS_HOME=/home/alice
          export ALSA_PLUGIN_DIR
          ALSA_PLUGIN_DIR=$(readlink -f alsa-plugins)/lib/alsa-lib
          timeout -k 10 600 ./shots.sh cinq/bin/cinq show shots
          oxipng --quiet --opt 4 --strip safe shots/*.png
          ls -l shots
          echo "--- cinq"
          cat shots/cinq.log
      - if: always()
        uses: actions/upload-artifact@main
        with:
          name: shots
          path: shots
          if-no-files-found: ignore
