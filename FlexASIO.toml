# FlexASIO on the default WASAPI device, VB-CABLE, with no input, taking
# 32-bit integers on two channels, as the ASIO driver of the Dante Virtual
# Soundcard takes integers
backend = "Windows WASAPI"

[input]
device = ""

[output]
channels = 2
sampleType = "Int32"
