# Test show for cinq beside an ETC Ion Xe.  Change 10.101.100.20 to the
# console's address if it differs (Setup > Device > Network on the console).
#
# Cue 1 only pings Eos and changes nothing on stage; with Incoming OSC on in
# the console's Diagnostics tab (Tab 99), it shows as a line there.  Cues 2
# and 3 fire cues on the console: run them only once the board operator
# says the console's cue list can move.  Cue 4 sends light levels as sACN
# and Art-Net to universe 999, which no rig is likely to use, for sACNView
# or Wireshark to watch, and cue 5 takes them away again.

[[instrument]]
id = 1
name = "Test 1"
universe = 999
address = 1

[[instrument]]
id = 2
name = "Test 2"
universe = 999
address = 2

[[list]]
name = "Main"

[[list.cue]]
id = 1
number = "1"
kind = "network"
name = "Ping the console"
destination = "10.101.100.20:3037"
message = "/eos/ping"

[[list.cue]]
id = 2
number = "2"
kind = "network"
name = "Fire console cue 1 of list 1"
destination = "10.101.100.20:3037"
message = "/eos/cue/1/1/fire"

[[list.cue]]
id = 3
number = "3"
kind = "network"
name = "Press GO on the console"
destination = "10.101.100.20:3037"
message = "/eos/key/go_0"

[[list.cue]]
id = 4
number = "4"
kind = "light"
name = "Universe 999 up"
duration = 2.0

[list.cue.lights]
1 = 100.0
2 = 50.0

[[list.cue]]
id = 5
number = "5"
kind = "light"
name = "Universe 999 out"
duration = 2.0

[list.cue.lights]
1 = 0.0
2 = 0.0
