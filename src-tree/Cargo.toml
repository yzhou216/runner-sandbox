[workspace]
members = ["xtask"]

[package]
name = "scrollreversed"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "Darwin daemon reversing mouse or trackpad scrolling"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
clap = { version = "4.6", features = ["derive"] }
etcetera = "0.11"
serde = { version = "1.0", features = ["derive"] }
toml = { version = "1.2", default-features = false, features = [
  "parse",
  "serde",
  "std",
] }

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
