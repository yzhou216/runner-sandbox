# Network cues for Eos on the same computer, in the styles a show uses: a
# cue by its number, GO, a cue by list and number, a command line with
# spaces, a destination that refuses the connection, and a cue after it
[[list]]
name = "Main"

[[list.cue]]
id = 1
number = "1"
kind = "network"
name = "Eos cue 1"
destination = "127.0.0.1:3037"
message = "/eos/cue/1/fire"

[[list.cue]]
id = 2
number = "2"
kind = "network"
name = "Eos GO"
destination = "127.0.0.1:3037"
message = "/eos/key/go_0"

[[list.cue]]
id = 3
number = "3"
kind = "network"
name = "Eos cue 1/3"
destination = "127.0.0.1:3037"
message = "/eos/cue/1/3/fire"

[[list.cue]]
id = 4
number = "4"
kind = "network"
name = "Eos command line"
destination = "127.0.0.1:3037"
message = '/eos/newcmd "Chan 1 Thru 3 At 50#"'

[[list.cue]]
id = 5
number = "5"
kind = "network"
name = "Nobody there"
destination = "127.0.0.1:3999"
message = "/eos/ping"

[[list.cue]]
id = 6
number = "6"
kind = "network"
name = "Eos cue 1/2"
destination = "127.0.0.1:3037"
message = "/eos/cue/1/2/fire"
