# One GO runs everything, each cue continuing to the next after its
# post-wait: light cues on universes 1, 2, and 999 (fire times from the GO:
# 0, 5, 9 s), then network cues to fakeeos.py (16 s on): TCP and UDP with
# int, float, and string arguments, a refused port, a burst of five within
# half a second, three apart by 3 s, one while the stand-in is down (it is
# down from 30.3 s to 33 s) and two once it is back, and a destination that
# never answers with a cue behind it
[[instrument]]
id = 1
name = "Front"
address = 1

[[instrument]]
id = 2
name = "Back"
address = 2

[[instrument]]
id = 3
name = "Second universe"
universe = 2
address = 10

[[instrument]]
id = 4
name = "Console universe"
universe = 999
address = 512

[[list]]
name = "Main"

[[list.cue]]
id = 1
number = "1"
kind = "light"
name = "Up"
duration = 1.0
advance = "continue"
post_wait = 5.0

[list.cue.lights]
1 = 20.0
3 = 50.0
4 = 100.0

[[list.cue]]
id = 2
number = "2"
kind = "light"
name = "Level"
duration = 1.0
advance = "continue"
post_wait = 4.0

[list.cue.lights]
1 = 70.0
2 = 100.0

[[list.cue]]
id = 3
number = "3"
kind = "light"
name = "Fade"
duration = 4.0
advance = "continue"
post_wait = 7.0

[list.cue.lights]
1 = 0.0
2 = 30.0
3 = 80.0

[[list.cue]]
id = 4
number = "4"
kind = "network"
name = "TCP arguments"
destination = "127.0.0.1:3037"
message = '/test 7 2.5 "12" hello'
advance = "continue"
post_wait = 0.2

[[list.cue]]
id = 5
number = "5"
kind = "network"
name = "UDP arguments"
destination = "udp://127.0.0.1:8000"
message = '/test 7 2.5 "12" hello'
advance = "continue"
post_wait = 0.2

[[list.cue]]
id = 6
number = "6"
kind = "network"
name = "Refused"
destination = "127.0.0.1:3999"
message = '/refused 1'
advance = "continue"
post_wait = 3.0

[[list.cue]]
id = 7
number = "7"
kind = "network"
name = "Burst 1"
destination = "127.0.0.1:3037"
message = '/burst/1'
advance = "continue"
post_wait = 0.1

[[list.cue]]
