# Three network cues to Eos, the first while it runs, the second while it
# is down, and the third once it is back
[[list]]
name = "Main"

[[list.cue]]
id = 1
number = "1"
kind = "network"
name = "Eos cue 1"
destination = "127.0.0.1:3037"
message = "/eos/cue/1/fire"

[[list.cue]]
id = 2
number = "2"
kind = "network"
name = "Eos down"
destination = "127.0.0.1:3037"
message = "/eos/cue/1/2/fire"

[[list.cue]]
id = 3
number = "3"
kind = "network"
name = "Eos back"
destination = "127.0.0.1:3037"
message = "/eos/cue/1/3/fire"
