# Network cues to fakeeos.py over TCP and UDP, at an address that darwin.sh
# puts in place of 127.0.0.1
[[list]]
name = "Main"

[[list.cue]]
id = 1
number = "1"
kind = "network"
name = "TCP"
destination = "127.0.0.1:3037"
message = "/eos/cue/1/fire"

[[list.cue]]
id = 2
number = "2"
kind = "network"
name = "UDP"
destination = "udp://127.0.0.1:8000"
message = '/test "hello world" 7'
